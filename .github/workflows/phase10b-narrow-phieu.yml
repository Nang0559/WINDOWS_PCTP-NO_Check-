name: Phase 10B narrow PhieuPresenter view boundary

on:
  push:
    paths:
      - '.github/workflows/phase10b-narrow-phieu.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narrow PhieuPresenter dependency
        shell: python
        run: |
          from pathlib import Path
          path = Path('PCTP/Presentation/Presenters/PhieuPresenter.cs')
          text = path.read_text(encoding='utf-8')
          if 'private readonly IPhieuView _v;' in text:
              print('Already migrated')
              raise SystemExit(0)
          text = text.replace('using PCTP.Presentation.Views;\n', 'using PCTP.Presentation.Views;\n')
          text = text.replace('private readonly HVNPresenterContext _c;\n', 'private readonly HVNPresenterContext _c;\n        private readonly IPhieuView _v;\n', 1)
          text = text.replace('_c = context; var v = _c.View;', '_c = context; _v = _c.PhieuView; var v = _v;', 1)
          text = text.replace('_c.View.', '_v.')
          path.write_text(text, encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/Presentation/Presenters/PhieuPresenter.cs
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Phase 10B: narrow PhieuPresenter view dependency'
          git push
