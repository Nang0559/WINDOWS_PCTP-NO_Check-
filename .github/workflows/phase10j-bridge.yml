name: phase10j-bridge

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor HVN_PGH checklist bridge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          s = p.read_text(encoding='utf-8')

          # Delegate checklist binding/locking/reading to PhieuHeaderControl.
          s = re.sub(
              r'        public void BindGioXuatCheckList\(List<string> danhSachGio\)\s*\{.*?\n        \}\n        // Handler double-click vào cột LOT',
              '''        public void BindGioXuatCheckList(List<string> danhSachGio)\n        {\n            if (_phieuHeaderControl != null)\n            {\n                _phieuHeaderControl.BindGioXuatCheckList(danhSachGio);\n                return;\n            }\n        }\n        // Handler double-click vào cột LOT''',
              s, flags=re.S)

          s = re.sub(
              r'        public void LockCheckListYMVN\(\)\s*\{.*?\n        \}\n\n        public void UnlockCheckListYMVN\(\)\s*\{.*?\n        \}',
              '''        public void LockCheckListYMVN()\n        {\n            if (_phieuHeaderControl != null)\n                _phieuHeaderControl.LockCheckListYMVN();\n        }\n\n        public void UnlockCheckListYMVN()\n        {\n            if (_phieuHeaderControl != null)\n                _phieuHeaderControl.UnlockCheckListYMVN();\n        }''',
              s, flags=re.S)

          s = re.sub(
              r'        public List<string> GetCheckedGioXuat\(\)\s*\{.*?\n        \}',
              '''        public List<string> GetCheckedGioXuat()\n        {\n            return _phieuHeaderControl != null\n                ? _phieuHeaderControl.GetCheckedGioXuat()\n                : new List<string>();\n        }''',
              s, count=1, flags=re.S)

          # Remove the legacy ItemCheck handler; the UserControl now owns the event.
          s = re.sub(
              r'        // Handler mới trong HVN_PGH:\n        private void CheckGX_OnItemCheck\(object sender, DevExpress\.XtraEditors\.Controls\.ItemCheckEventArgs e\)\s*\{.*?\n        \}\n',
              '', s, count=1, flags=re.S)

          # Delegate checked-state restore to the header control.
          marker = '        public void SetupYMVNButtons()'
          method = '''        public void SetCheckedGiosYMVN(List<string> checkedGios)\n        {\n            if (_phieuHeaderControl != null)\n                _phieuHeaderControl.SetCheckedGiosYMVN(checkedGios);\n        }\n\n'''
          if 'public void SetCheckedGiosYMVN(List<string> checkedGios)' not in s:
              s = s.replace(marker, method + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '            _phieuHeaderControl.TabChanged += PhieuHeaderControl_TabChanged;\n            _phieuHeaderControl.LoaiPhieuChanged += PhieuHeaderControl_LoaiPhieuChanged;',
              '            _phieuHeaderControl.TabChanged += PhieuHeaderControl_TabChanged;\n            _phieuHeaderControl.GioXuatCheckedChanged += PhieuHeaderControl_GioXuatCheckedChanged;\n            _phieuHeaderControl.CheckGX_ItemCheck += PhieuHeaderControl_CheckGX_ItemCheck;\n            _phieuHeaderControl.LoaiPhieuChanged += PhieuHeaderControl_LoaiPhieuChanged;')
          s = s.replace(
              '        private void PhieuHeaderControl_LoaiPhieuChanged(object sender, EventArgs e)\n        {',
              '        private void PhieuHeaderControl_GioXuatCheckedChanged(object sender, EventArgs e)\n        {\n            GioXuatCheckedChanged.Invoke(this, e);\n        }\n\n        private void PhieuHeaderControl_CheckGX_ItemCheck(object sender, EventArgs e)\n        {\n            CheckGX_ItemCheck.Invoke(this, e);\n        }\n\n        private void PhieuHeaderControl_LoaiPhieuChanged(object sender, EventArgs e)\n        {')
          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs
          git commit -m "Phase 10J: delegate YMVN checklist UI to PhieuHeaderControl"
          git push

          rm -f .github/workflows/phase10j-bridge.yml
          git add .github/workflows/phase10j-bridge.yml
          git commit -m "Phase 10J: remove temporary refactor workflow"
          git push