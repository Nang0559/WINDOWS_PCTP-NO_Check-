name: One-shot status-zero normalization

on:
  push:
    branches:
      - feature/pctp-qc-test-platform

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event.head_commit.message != 'fix(stock): enforce status-zero current stock paths' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/pctp-qc-test-platform
          fetch-depth: 0

      - name: Normalize current-stock filters
        shell: python
        run: |
          from pathlib import Path

          targets = {
              Path('PCTP/Modules/KhoCore/Repositories/SlotRepository.cs'): 2,
              Path('PCTP/Modules/KhoCore/Repositories/BulkStockSlotRepository.cs'): 1,
          }

          changed = []
          for path, expected in targets.items():
              text = path.read_text(encoding='utf-8-sig')
              old = 'PhieuStatus <> 3'
              count = text.count(old)
              if count not in (0, expected):
                  raise SystemExit(f'{path}: unexpected {count} occurrences of {old!r}; expected 0 or {expected}')
              if count == expected:
                  path.write_text(text.replace(old, 'PhieuStatus = 0'), encoding='utf-8-sig', newline='')
                  changed.append(f'{path}: {count}')

          if not changed:
              print('No legacy current-stock filters remained.')
          else:
              print('Normalized:')
              for item in changed:
                  print(item)

      - name: Verify normalized filters
        shell: bash
        run: |
          set -euo pipefail
          if grep -nF 'PhieuStatus <> 3' PCTP/Modules/KhoCore/Repositories/SlotRepository.cs PCTP/Modules/KhoCore/Repositories/BulkStockSlotRepository.cs; then
            echo 'Legacy status filter remains in targeted current-stock repositories.'
            exit 1
          fi
          grep -nF 'PhieuStatus = 0' PCTP/Modules/KhoCore/Repositories/SlotRepository.cs
          grep -nF 'PhieuStatus = 0' PCTP/Modules/KhoCore/Repositories/BulkStockSlotRepository.cs

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PCTP/Modules/KhoCore/Repositories/SlotRepository.cs PCTP/Modules/KhoCore/Repositories/BulkStockSlotRepository.cs; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/Modules/KhoCore/Repositories/SlotRepository.cs PCTP/Modules/KhoCore/Repositories/BulkStockSlotRepository.cs
          git commit -m 'fix(stock): enforce status-zero current stock paths'
          git push origin HEAD:feature/pctp-qc-test-platform
