name: phase9f-migrate
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  migrate:
    if: contains(github.event.head_commit.message, 'Phase 9F') == false && contains(github.event.head_commit.message, 'phase9f-migrate') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate bottom-state grids into UserControl
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('PCTP/Modules/GiaoHangKhach/HVN')
          designer = root / 'HVN_PGH.Designer.cs'
          control = root / 'Controls' / 'PhieuBottomStateControl.cs'
          migration = root / 'HVN_PGH.PhieuGridMigration.cs'
          text = designer.read_text(encoding='utf-8-sig')
          names = ['sidePanel4','gridCtrSUASL','gridVSUASL','gridCTTGL','GridVTTGL','gridBand1','gridColumn4','gridColumn5','gridColumn6','gridCLECH','bandedGridViewLECH','colLechMaHang','colLechTenHang','colLechSoLuong','colLechNguon','gridBandLECH']
          for n in names:
              text = re.sub(r'^\s*(?:public\s+)?(?:private|protected|internal)\s+[^;\n]+\s+' + re.escape(n) + r'\s*;\s*\r?\n', '', text, flags=re.M)
              text = re.sub(r'^\s*\(\(System\.ComponentModel\.ISupportInitialize\)\(this\.' + re.escape(n) + r'\)\)\.BeginInit\(\);\s*\r?\n', '', text, flags=re.M)
              text = re.sub(r'^\s*\(\(System\.ComponentModel\.ISupportInitialize\)\(this\.' + re.escape(n) + r'\)\)\.EndInit\(\);\s*\r?\n', '', text, flags=re.M)
              text = re.sub(r'^\s*this\.' + re.escape(n) + r'\.SuspendLayout\(\);\s*\r?\n', '', text, flags=re.M)
              text = re.sub(r'^\s*this\.' + re.escape(n) + r'\.ResumeLayout\([^\n]*\);\s*\r?\n', '', text, flags=re.M)
          def take(start, end):
              nonlocal_text = globals()
              p1 = nonlocal_text['text'].index(start)
              p2 = nonlocal_text['text'].index(end, p1)
              block = nonlocal_text['text'][p1:p2]
              nonlocal_text['text'] = nonlocal_text['text'][:p1] + nonlocal_text['text'][p2:]
              return block
          block_ttgl = take('            // gridCTTGL\n', '            // sidePanel3\n')
          block_suasl = take('            // gridCtrSUASL\n', '            // imageBT\n')
          block_lech = take('            // gridCLECH\n', '            // HVN_PGH\n')
          text = re.sub(r'            // sidePanel4\n.*?(?=            // imageBT\n)', '', text, flags=re.S)
          text = text.replace('            this.sidePanel3.Controls.Add(this.sidePanel4);\n', '            this.sidePanel3.Controls.Add(this._phieuBottomStateControl);\n')
          marker = '            this.components = new System.ComponentModel.Container();\n'
          text = text.replace(marker, marker + '            this._phieuBottomStateControl = new PCTP.QRCODE_HVN.PGH.Controls.PhieuBottomStateControl();\n', 1)
          forbidden = ['this.sidePanel4','this.gridCLECH','this.gridCTTGL','this.gridCtrSUASL','this.gridVSUASL']
          leftovers = [x for x in forbidden if x in text]
          if leftovers: raise SystemExit('Designer ownership leftovers: ' + ', '.join(leftovers))
          designer.write_text(text, encoding='utf-8-sig')
          control_text = '''using DevExpress.XtraGrid;\nusing DevExpress.XtraGrid.Columns;\nusing DevExpress.XtraGrid.Views.BandedGrid;\nusing DevExpress.XtraGrid.Views.Grid;\nusing DevExpress.XtraEditors;\nusing System.Windows.Forms;\n\nnamespace PCTP.QRCODE_HVN.PGH.Controls\n{\n    public sealed class PhieuBottomStateControl : XtraUserControl\n    {\n        private readonly GridControl gridCLECH;\n        private readonly BandedGridView bandedGridViewLECH;\n        private readonly BandedGridColumn colLechMaHang;\n        private readonly BandedGridColumn colLechTenHang;\n        private readonly BandedGridColumn colLechSoLuong;\n        private readonly BandedGridColumn colLechNguon;\n        private readonly GridBand gridBandLECH;\n        private readonly GridControl gridCTTGL;\n        private readonly BandedGridView GridVTTGL;\n        private readonly GridBand gridBand1;\n        private readonly BandedGridColumn gridColumn4;\n        private readonly BandedGridColumn gridColumn5;\n        private readonly BandedGridColumn gridColumn6;\n        private readonly GridControl gridCtrSUASL;\n        private readonly GridView gridVSUASL;\n        public GridControl LechGrid { get { return gridCLECH; } }\n        public GridControl GhepLotGrid { get { return gridCTTGL; } }\n        public GridControl SuaSlGrid { get { return gridCtrSUASL; } }\n        public GridView SuaSlView { get { return gridVSUASL; } }\n        public PhieuBottomStateControl()\n        {\n            gridCLECH = new GridControl(); bandedGridViewLECH = new BandedGridView();\n            colLechMaHang = new BandedGridColumn(); colLechTenHang = new BandedGridColumn();\n            colLechSoLuong = new BandedGridColumn(); colLechNguon = new BandedGridColumn(); gridBandLECH = new GridBand();\n            gridCTTGL = new GridControl(); GridVTTGL = new BandedGridView(); gridBand1 = new GridBand();\n            gridColumn4 = new BandedGridColumn(); gridColumn5 = new BandedGridColumn(); gridColumn6 = new BandedGridColumn();\n            gridCtrSUASL = new GridControl(); gridVSUASL = new GridView(); InitializeComponent();\n        }\n        private void InitializeComponent()\n        {\n''' + block_ttgl + block_suasl + block_lech + '''\n            this.Controls.Add(this.gridCLECH);\n            this.Controls.Add(this.gridCTTGL);\n            this.Controls.Add(this.gridCtrSUASL);\n        }\n        public void ShowLech() { gridCLECH.Visible=true; gridCTTGL.Visible=false; gridCtrSUASL.Visible=false; gridCLECH.BringToFront(); }\n        public void ShowGhepLot() { gridCLECH.Visible=false; gridCTTGL.Visible=true; gridCtrSUASL.Visible=false; gridCTTGL.BringToFront(); }\n        public void ShowSuaSoLuong() { gridCLECH.Visible=false; gridCTTGL.Visible=false; gridCtrSUASL.Visible=true; gridCtrSUASL.BringToFront(); }\n    }\n}\n'''
          control.write_text(control_text, encoding='utf-8')
          migration_text = migration.read_text(encoding='utf-8-sig')
          migration_text = migration_text.replace('using System.Windows.Forms;\n', 'using System.Windows.Forms;\nusing DevExpress.XtraGrid;\nusing DevExpress.XtraGrid.Views.Grid;\n')
          start = migration_text.index('        private PhieuGridControl _phieuGridControl;')
          end = migration_text.index('        protected override void OnLoad', start)
          replacement = '''        private PhieuGridControl _phieuGridControl;\n        private DocQrControl _docQrControl;\n        private PhieuBottomStateControl _phieuBottomStateControl;\n        private GridControl gridCLECH { get { return _phieuBottomStateControl.LechGrid; } }\n        private GridControl gridCTTGL { get { return _phieuBottomStateControl.GhepLotGrid; } }\n        private GridControl gridCtrSUASL { get { return _phieuBottomStateControl.SuaSlGrid; } }\n        private GridView gridVSUASL { get { return _phieuBottomStateControl.SuaSlView; } }\n\n'''
          migration_text = migration_text[:start] + replacement + migration_text[end:]
          migration_text = migration_text.replace('            MigrateSidePanel4ToUserControl();\n', '')
          marker = '        /// <summary>\n        /// Replaces the legacy sidePanel4'
          m = migration_text.find(marker)
          if m >= 0:
              e = migration_text.find('        }\n    }\n}', m)
              migration_text = migration_text[:m] + migration_text[e+10:]
          migration.write_text(migration_text, encoding='utf-8-sig')
      - name: Commit Phase 9F
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.Designer.cs PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuBottomStateControl.cs PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs
          git commit -m "Phase 9F: move bottom-state grid ownership out of Designer"
          git push
