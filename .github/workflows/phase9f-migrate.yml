name: phase9f-migrate
on:
  push:
    branches: [ master ]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'fix 9F declarations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy Designer declarations
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.Designer.cs')
          s=p.read_text(encoding='utf-8-sig')
          names=['sidePanel4','gridCtrSUASL','gridVSUASL','gridCTTGL','GridVTTGL','gridBand1','gridColumn4','gridColumn5','gridColumn6','gridCLECH','bandedGridViewLECH','colLechMaHang','colLechTenHang','colLechSoLuong','colLechNguon','gridBandLECH']
          for n in names:
              s=re.sub(r'^\s*(?:public\s+)?(?:private|protected|internal)\s+[^;\n]+\s+'+re.escape(n)+r'\s*;\s*\r?\n','',s,flags=re.M)
          p.write_text(s,encoding='utf-8-sig')
          q=Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs')
          ms=q.read_text(encoding='utf-8-sig')
          assert 'PhieuBottomStateControl _phieuBottomStateControl' not in ms
          q.write_text(ms,encoding='utf-8-sig')
      - name: Validate
        shell: bash
        run: |
          set -e
          ! grep -nE '^\s*(public\s+)?(private|protected|internal)\s+.*(sidePanel4|gridCtrSUASL|gridVSUASL|gridCTTGL|GridVTTGL|gridBand1|gridColumn4|gridColumn5|gridColumn6|gridCLECH|bandedGridViewLECH|colLechMaHang|colLechTenHang|colLechSoLuong|colLechNguon|gridBandLECH)\s*;' PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.Designer.cs
      - name: Commit and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/phase9f-trigger.txt .github/workflows/phase9f-migrate.yml
          git add -A
          git commit -m "Phase 9F: remove legacy bottom-state Designer declarations"
          git push
