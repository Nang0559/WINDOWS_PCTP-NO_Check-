name: PCTP Refactor Verification

on:
  push:
    branches:
      - feature/baocao-deliverytrace-refactor
  pull_request:
    branches:
      - master
      - feature/baocao-deliverytrace-refactor

jobs:
  build-and-architecture-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore PCTP.sln

      - name: Build PCTP
        shell: pwsh
        run: msbuild PCTP.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RestorePackages=false

      - name: Verify delivery architecture boundaries
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'PCTP'
          $newAreas = @(
            (Join-Path $root 'Shell'),
            (Join-Path $root 'Modules\BaoCao'),
            (Join-Path $root 'Modules\GiaoHangKhach')
          )

          $forbidden = @(
            'GIAOHANGYMN',
            'YAMAHAQRCDE_SP'
          )

          $files = foreach ($area in $newAreas) {
            if (Test-Path $area) {
              Get-ChildItem $area -Recurse -File -Include *.cs,*.csproj,*.md
            }
          }

          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw
            foreach ($token in $forbidden) {
              if ($text -match [regex]::Escape($token)) {
                throw "Legacy delivery dependency '$token' found in new architecture area: $($file.FullName)"
              }
            }
          }

          $hvnForm = Join-Path $root 'Modules\GiaoHangKhach\HVN\HVN_PGH.cs'
          if (Test-Path $hvnForm) {
            $hvnText = Get-Content $hvnForm -Raw
            if ($hvnText -match 'IFSRepository\s*\.\s*Create\s*\(') {
              throw "HVN_PGH must not create IFSRepository directly; use the customer delivery module boundary."
            }
          }

      - name: Verify unified receiving boundary
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'PCTP'
          $receivingForm = Join-Path $root 'Modules\KhoVatLy\FormEnterItemSV.cs'
          $receivingService = Join-Path $root 'Modules\NhapKho\Services\NhapTpReceivingService.cs'

          if (-not (Test-Path $receivingForm)) {
            throw "Unified receiving UI is missing: $receivingForm"
          }
          if (-not (Test-Path $receivingService)) {
            throw "Unified receiving service is missing: $receivingService"
          }

          $formText = Get-Content $receivingForm -Raw
          $forbiddenReceivingDependencies = @(
            'StockTpRepository',
            'PhieuTrackingRepository',
            'StockTpCaseRepository',
            'StockTpProductionRepository',
            'StockTpStatusRepository',
            'StockHistoryRepository',
            'IStockMovementService'
          )

          foreach ($token in $forbiddenReceivingDependencies) {
            if ($formText -match [regex]::Escape($token)) {
              throw "FormEnterItemSV must not depend directly on '$token'; use INhapTpReceivingService."
            }
          }

          if ($formText -match 'StockService\s*\.\s*ImportLotToSlot') {
            throw "FormEnterItemSV must not use the legacy StockService.ImportLotToSlot receiving path."
          }

          $serviceText = Get-Content $receivingService -Raw
          if ($serviceText -notmatch '_uow\.Begin\(\)') {
            throw "NhapTpReceivingService must own the receiving transaction boundary."
          }
          if ($serviceText -notmatch '_stockMovement\.Receive\(') {
            throw "NhapTpReceivingService must route stock mutation through IStockMovementService.Receive."
          }
          if ($serviceText -notmatch '_phieuRepo\.InsertPhieuMoi\(') {
            throw "NhapTpReceivingService must persist the receiving tracking record."
          }
          if ($serviceText -notmatch '_caseRepo\.InsertCaseHistory\(') {
            throw "NhapTpReceivingService must persist the production case history."
          }
          if ($serviceText -notmatch '_historyRepo\.SaveHistory\(') {
            throw "NhapTpReceivingService must persist stock history in the same workflow."
          }

          # LOT reopen must be deferred until inside the receiving transaction.
          if ($serviceText -match 'public void MoLaiLot[\s\S]{0,800}_stockTpStatus\.MoLaiLot\(') {
            throw "MoLaiLot must not mutate STOCKTP directly before receiving; defer the mutation to NhapTpVaoSlot."
          }

      - name: Verify DeliveryTrace contracts
        shell: pwsh
        run: |
          $required = @(
            'PCTP\Modules\BaoCao\Application\Contracts\Repositories\IDeliveryTraceRepository.cs',
            'PCTP\Modules\BaoCao\Infrastructure\Repositories\DeliveryTraceRepository.cs',
            'PCTP\Modules\BaoCao\Infrastructure\Queries\DeliveryTraceReadService.cs'
          )

          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $path))) {
              throw "Required DeliveryTrace contract/file is missing: $path"
            }
          }