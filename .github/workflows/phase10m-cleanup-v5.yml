name: phase10m-cleanup-v5

on:
  push:
    paths:
      - '.phase10m-trigger-v5'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete header handlers and subscriptions
        shell: python
        run: |
          from pathlib import Path

          path = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          lines = path.read_text(encoding='utf-8-sig').splitlines(True)

          methods = {
              'private void dateNX_EditValueChanged',
              'private void tabPaneHVN_Click',
              'private void RDO_GXHN_SelectedIndexChanged',
              'private void radioGroup2_SelectedIndexChanged',
          }
          subscriptions = {
              'dateNX_EditValueChanged',
              'tabPaneHVN_Click',
              'RDO_GXHN_SelectedIndexChanged',
              'radioGroup2_SelectedIndexChanged',
          }

          text = ''.join(lines)
          for target in methods:
              if text.count(target) != 1:
                  raise SystemExit(f'Expected one obsolete method: {target}; found {text.count(target)}')

          out = []
          i = 0
          while i < len(lines):
              stripped = lines[i].strip()

              if any(stripped.startswith(name) for name in methods):
                  if '=>' in stripped:
                      i += 1
                      continue
                  i += 1
                  depth = 0
                  opened = False
                  while i < len(lines):
                      s = lines[i]
                      depth += s.count('{')
                      depth -= s.count('}')
                      if '{' in s:
                          opened = True
                      i += 1
                      if opened and depth <= 0:
                          break
                  continue

              if '+=' in lines[i] and any(name in lines[i] for name in subscriptions):
                  i += 1
                  continue

              out.append(lines[i])
              i += 1

          new_text = ''.join(out)
          for target in methods:
              if target in new_text:
                  raise SystemExit(f'Obsolete method still present: {target}')
          for target in subscriptions:
              if target in new_text:
                  raise SystemExit(f'Obsolete event reference still present: {target}')

          path.write_text(new_text, encoding='utf-8-sig')

      - name: Verify and commit cleanup
        shell: bash
        run: |
          git diff --check
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs
          git diff --cached --check
          git commit -m "Phase 10M: remove obsolete header event handlers"
          git push
