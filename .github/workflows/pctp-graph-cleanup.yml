name: PCTP project graph cleanup

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[graph-cleanup-run]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Move source ownership into PCTP.csproj
        shell: pwsh
        run: |
          $csproj = 'PCTP/PCTP.csproj'
          $targets = 'PCTP/Directory.Build.targets'

          $targetText = Get-Content -Raw -Encoding UTF8 $targets
          $compilePaths = [regex]::Matches($targetText, '<Compile\s+Include="([^"]+)"\s*/>') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique

          $csprojText = Get-Content -Raw -Encoding UTF8 $csproj
          foreach ($path in $compilePaths) {
            $escaped = [regex]::Escape($path)
            if ($csprojText -notmatch '<Compile\s+Include="' + $escaped + '"') {
              $line = '    <Compile Include="' + $path + '" />' + [Environment]::NewLine
              $marker = '    <None Include="Workflow\Diagram\Dashboard.md" />'
              if ($csprojText.Contains($marker)) {
                $csprojText = $csprojText.Replace($marker, $line + $marker)
              } else {
                $close = $csprojText.IndexOf('</ItemGroup>')
                if ($close -lt 0) { throw 'No ItemGroup found in PCTP.csproj.' }
                $csprojText = $csprojText.Insert($close, $line)
              }
            }
          }

          [IO.File]::WriteAllText($csproj, $csprojText, [Text.UTF8Encoding]::new($true))

          $cleanTargets = [regex]::Replace($targetText, '(?m)^\s*<Compile\s+Include="[^"]+"\s*/>\s*\r?\n', '')
          [IO.File]::WriteAllText($targets, $cleanTargets, [Text.UTF8Encoding]::new($true))

      - name: Verify no Compile entries remain in Directory.Build.targets
        shell: pwsh
        run: |
          $targets = Get-Content -Raw -Encoding UTF8 'PCTP/Directory.Build.targets'
          if ($targets -match '<Compile\s+Include=') { throw 'Directory.Build.targets still owns source Compile items.' }

      - name: Commit graph cleanup
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/PCTP.csproj PCTP/Directory.Build.targets
          if (git diff --cached --quiet) {
            Write-Host 'No graph changes required.'
            exit 0
          }
          git commit -m 'refactor: move PCTP source ownership into csproj [graph-cleanup-run]'
          git push origin HEAD:master
