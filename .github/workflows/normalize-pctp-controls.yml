name: Normalize PCTP HVN controls

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'chore: normalize PCTP HVN controls project entries'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize legacy project graph
        shell: python
        run: |
          from pathlib import Path

          controls = [
              'PhieuGridControl.cs',
              'DocQrControl.cs',
              'DocQrInputControl.cs',
              'GiaoDbControl.cs',
              'YmvnControl.cs',
              'PhieuActionBarControl.cs',
              'PhieuBottomStateControl.cs',
              'PhieuDialogControl.cs',
              'PhieuHeaderControl.cs',
              'HangThieuControl.cs',
          ]

          csproj = Path('PCTP/PCTP.csproj')
          text = csproj.read_text(encoding='utf-8-sig')
          marker = r'    <Compile Include="Modules\\GiaoHangKhach\\Configuration\\GiaoHangKhachConfiguration.cs" />'
          entries = '\n'.join(
              f'    <Compile Include="Modules\\GiaoHangKhach\\HVN\\Controls\\{name}" />'
              for name in controls
          )

          # Remove any previous explicit/wildcard control entries first.
          import re
          text = re.sub(
              r'^\s*<Compile Include="Modules\\GiaoHangKhach\\HVN\\Controls\\[^\"]+"\s*/>\r?\n?',
              '',
              text,
              flags=re.MULTILINE,
          )

          if marker not in text:
              raise SystemExit('Stable GiaoHangKhachConfiguration insertion point not found')
          text = text.replace(marker, entries + '\n' + marker, 1)

          folder = r'    <Folder Include="Modules\\GiaoHangKhach\\HVN\\Controls\\" />'
          folder_marker = r'    <Folder Include="Modules\\GiaoHangKhach\\Contracts\\Services\\" />'
          if folder not in text:
              text = text.replace(folder_marker, folder + '\n' + folder_marker, 1)

          csproj.write_text(text, encoding='utf-8-sig', newline='')

          targets = Path('PCTP/Directory.Build.targets')
          t = targets.read_text(encoding='utf-8-sig')
          for name in controls:
              line = f'    <Compile Include="Modules\\GiaoHangKhach\\HVN\\Controls\\{name}" />\n'
              t = t.replace(line, '', 1)
          targets.write_text(t, encoding='utf-8-sig', newline='')

          # Validate project ownership is explicit and unique.
          for name in controls:
              entry = f'Modules\\GiaoHangKhach\\HVN\\Controls\\{name}'
              if text.count(entry) != 1:
                  raise SystemExit(f'Expected exactly one project entry: {entry}')
              if entry in t:
                  raise SystemExit(f'Duplicate Directory.Build.targets entry remains: {entry}')

      - name: Verify XML and diff
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('PCTP/PCTP.csproj')
          PY
          git diff --check
          git diff -- PCTP/PCTP.csproj PCTP/Directory.Build.targets

      - name: Commit normalized project graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PCTP/PCTP.csproj PCTP/Directory.Build.targets
          git rm .github/workflows/normalize-pctp-controls.yml
          git diff --cached --check
          git commit -m "chore: normalize PCTP HVN controls project entries"
          git push origin HEAD:master
