name: phase10e-grid-cleanup

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'Phase 10E')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Delegate order-grid UI configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          s = p.read_text(encoding='utf-8-sig')
          old = '''        public void SetupGridDonHangYMVN(bool bangrieng)\n        {\n            // ← Cột GEAR đã có sẵn trong Designer, chỉ cần ẩn/hiện\n            SetColumnVisible(GridViewDONHANG, "GEAR", bangrieng);\n            SetColumnVisible(GridViewDONHANG, "PO_NO", bangrieng);\n\n            if (bangrieng)\n            {\n                SetColumnCaption(GridViewDONHANG, "GEAR", "Gear Sử Dụng");\n                SetColumnCaption(GridViewDONHANG, "CUA", "Cửa");\n                SetColumnCaption(GridViewDONHANG, "TRUYEN", "Truyền");\n                SetColumnCaption(GridViewDONHANG, "GIOGIAO", "Giờ");\n                SetColumnCaption(GridViewDONHANG, "PO_NO", "Số PO");\n            }\n        }\n\n        private void SetColumnVisible(BandedGridView view,\n            string fieldName, bool visible)\n        {\n\n            var col = view.Columns.ColumnByFieldName(fieldName);\n            if (col != null) col.Visible = visible;\n        }\n\n        private void SetColumnCaption(BandedGridView view,\n            string fieldName, string caption)\n        {\n            var col = view.Columns.ColumnByFieldName(fieldName);\n            if (col != null) col.Caption = caption;\n        }\n'''
          new = '''        public void SetupGridDonHangYMVN(bool bangrieng)\n        {\n            _phieuGridControl.SetupForCustomer(bangrieng);\n        }\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet -- PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs; then
            echo "No cleanup changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs
          git commit -m "Phase 10E: delegate order-grid setup from HVN_PGH"
          git push
