name: Phase 11E Remove Bridge
on:
  push:
    paths:
      - '.github/phase11e.trigger'
jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete bridge
        shell: bash
        run: |
          set -e
          rm -f PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.UiCompatibility.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.UiCompatibility.cs
          git commit -m 'Phase 11E: remove obsolete UI compatibility bridge'
          git push
