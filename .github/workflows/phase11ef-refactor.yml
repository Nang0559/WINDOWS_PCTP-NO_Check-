name: Phase 11E-11F Refactor
on:
  push:
    paths:
      - '.github/phase11ef.trigger'
jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply refactor
        shell: python
        run: |
          from pathlib import Path
          import re
          root = Path('PCTP/Modules/GiaoHangKhach/HVN')
          hvn = root / 'HVN_PGH.cs'
          text = hvn.read_text(encoding='utf-8')
          replacements = {
              'gridCLECH': '_phieuBottomStateControl.LechGrid',
              'gridCTTGL': '_phieuBottomStateControl.GhepLotGrid',
              'gridCtrSUASL': '_phieuBottomStateControl.SuaSlGrid',
              'gridVSUASL': '_phieuBottomStateControl.SuaSlView',
              'bandedGridViewLECH': '_phieuBottomStateControl.LechView',
              'gridBandLECH': '_phieuBottomStateControl.LechBand',
              'colLechMaHang': '_phieuBottomStateControl.LechMaHang',
              'colLechTenHang': '_phieuBottomStateControl.LechTenHang',
              'colLechSoLuong': '_phieuBottomStateControl.LechSoLuong',
              'colLechNguon': '_phieuBottomStateControl.LechNguon',
              'GridVTTGL': '_phieuBottomStateControl.GhepLotView',
              'gridBand1': '_phieuBottomStateControl.GhepLotBand',
              'gridColumn4': '_phieuBottomStateControl.GhepLotMaHang',
              'gridColumn5': '_phieuBottomStateControl.GhepLotGio',
              'gridColumn6': '_phieuBottomStateControl.GhepLotLot',
          }
          for old, new in replacements.items():
              text = re.sub(r'(?<![A-Za-z0-9_])' + re.escape(old) + r'(?![A-Za-z0-9_])', new, text)
          hvn.write_text(text, encoding='utf-8')

          mig = root / 'HVN_PGH.PhieuGridMigration.cs'
          m = mig.read_text(encoding='utf-8')
          helper = '''        private int ReplaceControl(Control existing, Control replacement, Control parent)\n        {\n            if (existing == null || replacement == null || parent == null)\n                return -1;\n\n            int childIndex = parent.Controls.GetChildIndex(existing);\n            parent.Controls.Remove(existing);\n            parent.Controls.Add(replacement);\n            parent.Controls.SetChildIndex(replacement, childIndex);\n            return childIndex;\n        }\n\n'''
          marker = '        private void MigratePhieuHeaderToUserControl()'
          if 'private int ReplaceControl(Control existing' not in m:
              m = m.replace(marker, helper + marker, 1)
          patterns = [
              ('''            int childIndex = parent.Controls.GetChildIndex(panelPhieu);\n\n            _phieuHeaderControl = new PhieuHeaderControl();\n\n            parent.Controls.Remove(panelPhieu);\n            parent.Controls.Add(_phieuHeaderControl);\n            parent.Controls.SetChildIndex(_phieuHeaderControl, childIndex);\n''', '''            _phieuHeaderControl = new PhieuHeaderControl();\n            ReplaceControl(panelPhieu, _phieuHeaderControl, parent);\n'''),
              ('''            int childIndex = parent.Controls.GetChildIndex(GCT_HT);\n\n            _hangThieuControl = new HangThieuControl();\n\n            parent.Controls.Remove(GCT_HT);\n            parent.Controls.Add(_hangThieuControl);\n            parent.Controls.SetChildIndex(_hangThieuControl, childIndex);\n''', '''            _hangThieuControl = new HangThieuControl();\n            ReplaceControl(GCT_HT, _hangThieuControl, parent);\n''')]
          for old, new in patterns:
              m = m.replace(old, new)
          old = '''            int childIndex = gridCtrDONHANG != null\n                ? sidePanel2.Controls.GetChildIndex(gridCtrDONHANG)\n                : sidePanel2.Controls.Count;\n\n            _phieuGridControl = new PhieuGridControl();\n\n            if (gridCtrDONHANG != null)\n                sidePanel2.Controls.Remove(gridCtrDONHANG);\n\n            sidePanel2.Controls.Add(_phieuGridControl);\n            sidePanel2.Controls.SetChildIndex(_phieuGridControl, childIndex);\n'''
          new = '''            _phieuGridControl = new PhieuGridControl();\n\n            if (gridCtrDONHANG != null)\n                ReplaceControl(gridCtrDONHANG, _phieuGridControl, sidePanel2);\n            else\n                sidePanel2.Controls.Add(_phieuGridControl);\n'''
          m = m.replace(old, new)
          old = '''            int childIndex = gridCtrDOCQrCODE != null\n                ? sidePanel2.Controls.GetChildIndex(gridCtrDOCQrCODE)\n                : sidePanel2.Controls.Count;\n\n            _docQrControl = new DocQrControl();\n\n            if (gridCtrDOCQrCODE != null)\n                sidePanel2.Controls.Remove(gridCtrDOCQrCODE);\n\n            sidePanel2.Controls.Add(_docQrControl);\n            sidePanel2.Controls.SetChildIndex(_docQrControl, childIndex);\n'''
          new = '''            _docQrControl = new DocQrControl();\n\n            if (gridCtrDOCQrCODE != null)\n                ReplaceControl(gridCtrDOCQrCODE, _docQrControl, sidePanel2);\n            else\n                sidePanel2.Controls.Add(_docQrControl);\n'''
          m = m.replace(old, new)
          mig.write_text(m, encoding='utf-8')

          targets = Path('PCTP/Directory.Build.targets')
          tt = targets.read_text(encoding='utf-8')
          tt = tt.replace('    <Compile Include="Modules\\GiaoHangKhach\\HVN\\HVN_PGH.UiCompatibility.cs" />\n', '')
          targets.write_text(tt, encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -e
          ! grep -q 'HVN_PGH.UiCompatibility.cs' PCTP/Directory.Build.targets
          grep -q 'private int ReplaceControl' PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs
          test ! -e PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.UiCompatibility.cs || true
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs PCTP/Directory.Build.targets
          git commit -m 'Phase 11E-11F: remove UI bridge and simplify migration'
          git push