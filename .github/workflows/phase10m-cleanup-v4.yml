name: phase10m-cleanup-v4

on:
  push:
    paths:
      - '.phase10m-trigger-v4'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete header event subscriptions
        shell: python
        run: |
          from pathlib import Path

          path = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          lines = path.read_text(encoding='utf-8-sig').splitlines(True)

          names = [
              'dateNX_EditValueChanged',
              'tabPaneHVN_Click',
              'RDO_GXHN_SelectedIndexChanged',
              'radioGroup2_SelectedIndexChanged',
          ]

          out = []
          removed = []
          for line in lines:
              if '+=' in line and any(name in line for name in names):
                  removed.append(line.strip())
                  continue
              out.append(line)

          if not removed:
              raise SystemExit('No obsolete header event subscriptions found')

          path.write_text(''.join(out), encoding='utf-8-sig')

      - name: Verify and commit cleanup
        shell: bash
        run: |
          git diff --check
          if grep -nE 'dateNX_EditValueChanged|tabPaneHVN_Click|RDO_GXHN_SelectedIndexChanged|radioGroup2_SelectedIndexChanged' PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs; then exit 1; fi
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs
          git diff --cached --check
          git commit -m "Phase 10M: remove obsolete header event subscriptions"
          git push
