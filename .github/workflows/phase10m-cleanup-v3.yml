name: phase10m-cleanup-v3

on:
  push:
    paths:
      - '.phase10m-trigger-v3'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete header handlers
        shell: python
        run: |
          from pathlib import Path

          path = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          lines = path.read_text(encoding='utf-8-sig').splitlines(True)

          targets = {
              'private void dateNX_EditValueChanged',
              'private void tabPaneHVN_Click',
              'private void RDO_GXHN_SelectedIndexChanged',
              'private void radioGroup2_SelectedIndexChanged',
          }

          text = ''.join(lines)
          for target in targets:
              if text.count(target) != 1:
                  raise SystemExit(f'Expected exactly one target: {target}; found {text.count(target)}')

          out = []
          i = 0
          while i < len(lines):
              stripped = lines[i].strip()

              if stripped.startswith('private void dateNX_EditValueChanged') or stripped.startswith('private void tabPaneHVN_Click'):
                  i += 1
                  continue

              if stripped.startswith('private void RDO_GXHN_SelectedIndexChanged') or stripped.startswith('private void radioGroup2_SelectedIndexChanged'):
                  i += 1
                  depth = 0
                  opened = False
                  while i < len(lines):
                      s = lines[i]
                      depth += s.count('{')
                      depth -= s.count('}')
                      if '{' in s:
                          opened = True
                      i += 1
                      if opened and depth <= 0:
                          break
                  continue

              out.append(lines[i])
              i += 1

          new_text = ''.join(out)
          for target in targets:
              if target in new_text:
                  raise SystemExit(f'Legacy handler still present: {target}')

          path.write_text(new_text, encoding='utf-8-sig')

      - name: Verify and commit cleanup
        shell: bash
        run: |
          git diff --check
          if grep -nE 'dateNX_EditValueChanged|tabPaneHVN_Click|RDO_GXHN_SelectedIndexChanged|radioGroup2_SelectedIndexChanged' PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs; then exit 1; fi
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs
          git diff --cached --check
          git commit -m "Phase 10M: remove obsolete header event handlers"
          git push
