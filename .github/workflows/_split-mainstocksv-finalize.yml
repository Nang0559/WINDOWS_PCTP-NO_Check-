name: Split MainStockSV

on:
  push:
    branches:
      - feature/baocao-tra-cuu

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/baocao-tra-cuu
          fetch-depth: 1

      - name: Split MainStockSV
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('PCTP/Modules/KhoVatLy')
          src_path = root / 'MainStockSV.cs'
          src = src_path.read_text(encoding='utf-8-sig')
          src = src.replace('namespace PCTP.VIEWSTOCK', 'namespace PCTP.Modules.KhoVatLy', 1)
          src = src.replace('using PCTP.Modules.KhoVatLy;\n', '', 1)

          groups = {
              'Dashboard': ['BuildDashboardBar','MakeDashLabel','BuildSlotDetailPanel','RefreshDashboardBar','ShowDoiChieuLech'],
              'Canvas': ['OnSlotClicked','InitCanvasSettings','ScheduleHidePopup','LoadAllWarehouses','PnlMain_Paint','pnlMain_MouseDoubleClick','ShowSlotContextMenu','PnlMain_MouseMove','ShowExportFormFromCanvas','ShowCanvasRackContextMenu','DeleteRackFromCanvas','SetDoubleBuffered'],
              'Search': ['FilterSlotByTemCode','InitPEditInput','BindPEditInput','PEditInput_TextChanged','PEditInput_Closed','PEditInput_KeyDown','GridView_KeyDown','PEditInput_MouseClick','btnReset_Click'],
              'Navigation': ['btnRegisterRack_Click','AllSlots','btnEnterItem_Click','simpleButton1_Click'],
              'Inspection': ['btnDKMa_Click','btnHisCheck_Click'],
              'Lifecycle': ['MainStock_Load','MainStock_Shown','MainStock_Resize','OnExternalStockChanged','OnSlotUpdated','OnFormClosed']
          }

          method_names = {n for names in groups.values() for n in names}

          def find_member(text, name):
              pat = re.compile(r'(?m)^\s*(?:public|private|protected|internal)\s+(?:(?:static|async|new|virtual|override|sealed)\s+)*[^\n;{]+\b' + re.escape(name) + r'\s*(?:\([^\n]*\))?\s*(?:\{|=>|\n)')
              m = pat.search(text)
              if not m:
                  raise RuntimeError('Cannot find member: ' + name)
              begin = m.start()
              brace = text.find('{', m.end() - 1)
              arrow = text.find('=>', m.end() - 1)
              semi = text.find(';', m.end() - 1)
              first = min(x for x in (brace, arrow, semi) if x >= 0)
              if first == arrow and (brace < 0 or arrow < brace):
                  end = text.find(';', arrow)
                  return begin, end + 1
              if first == semi and (brace < 0 or semi < brace):
                  return begin, semi + 1
              depth = 0
              i = brace
              string = char = line = block = verbatim = False
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
                  if line:
                      if c == '\n': line = False
                  elif block:
                      if c == '*' and n == '/': block = False; i += 1
                  elif string:
                      if verbatim:
                          if c == '"' and n == '"': i += 1
                          elif c == '"': string = False
                      else:
                          if c == '\\': i += 1
                          elif c == '"': string = False
                  elif char:
                      if c == '\\': i += 1
                      elif c == "'": char = False
                  else:
                      if c == '/' and n == '/': line = True; i += 1
                      elif c == '/' and n == '*': block = True; i += 1
                      elif c == '@' and n == '"': string = True; verbatim = True; i += 1
                      elif c == '"': string = True; verbatim = False
                      elif c == "'": char = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return begin, i + 1
                  i += 1
              raise RuntimeError('Unbalanced member: ' + name)

          found = []
          for name in method_names:
              b, e = find_member(src, name)
              found.append((b, e, name))
          extracted = {name: src[b:e].strip() for b, e, name in found}

          for b, e, name in sorted(found, reverse=True):
              src = src[:b] + src[e:]

          src = re.sub(r'\n\s*\n\s*\n+', '\n\n', src)
          src_path.write_text(src.rstrip() + '\n', encoding='utf-8')

          header = '''using DevExpress.Utils.Extensions;
          using DevExpress.XtraEditors;
          using DevExpress.XtraEditors.Controls;
          using DevExpress.XtraEditors.Repository;
          using DevExpress.XtraGrid.Views.Grid;
          using DevExpress.XtraSplashScreen;
          using DevExpress.XtraVerticalGrid;
          using PCTP.ClassSQL;
          using PCTP.Common;
          using PCTP.Modules.GiaoHangKhach;
          using PCTP.Modules.KhoCore.Interfaces;
          using PCTP.Modules.KhoCore.Repositories;
          using PCTP.Modules.KhoCore.Services;
          using PCTP.Modules.KhoVatLy.Application.Interfaces;
          using PCTP.Modules.KhoVatLy.Application.Services;
          using PCTP.Modules.KhoVatLy.Kho.Models;
          using PCTP.Modules.KhoVatLy.Repositories;
          using PCTP.Modules.KhoVatLy.Repository;
          using PCTP.Modules.NhapKho.Interfaces;
          using PCTP.Modules.NhapKho.Repository;
          using PCTP.Modules.NhapKho.Services;
          using PCTP.Modules.XuatKho.Interfaces;
          using PCTP.Modules.XuatKho.Repositories;
          using PCTP.Modules.XuatKho.Services;
          using PCTP.Shared.Common;
          using PCTP.Shared.Services;
          using PCTP.VIEWSTOCK.CanVas;
          using PCTP.VIEWSTOCK.Fuction;
          using PCTP.VIEWSTOCK.FunctionForm;
          using PCTP.VIEWSTOCK.Models;
          using PCTP.VIEWSTOCK.Repository;
          using PCTP.VIEWSTOCK.UCControls;
          using PCTP.VIEWSTOCK.ViewForm;
          using System;
          using System.Collections.Generic;
          using System.ComponentModel;
          using System.Data;
          using System.Data.Linq.SqlClient;
          using System.Data.SqlClient;
          using System.Drawing;
          using System.Linq;
          using System.Runtime.InteropServices.ComTypes;
          using System.Text;
          using System.Threading.Tasks;
          using System.Windows.Forms;

          namespace PCTP.Modules.KhoVatLy
          {
              public partial class MainStockSV
              {
          '''
          header = '\n'.join(line[10:] if line.startswith('          ') else line for line in header.splitlines()) + '\n'

          for group, names in groups.items():
              members = [extracted[n] for n in names]
              body = header + '\n'.join('        ' + m.replace('\n', '\n        ').rstrip() for m in members) + '\n    }\n}\n'
              body = '\n'.join(line.rstrip() for line in body.splitlines()) + '\n'
              (root / ('MainStockSV.' + group + '.cs')).write_text(body, encoding='utf-8')

          designer = root / 'MainStockSV.Designer.cs'
          d = designer.read_text(encoding='utf-8-sig').replace('namespace PCTP.VIEWSTOCK', 'namespace PCTP.Modules.KhoVatLy', 1)
          designer.write_text(d, encoding='utf-8')

          bridge = root / 'MainStockSV.ModuleNamespace.cs'
          if bridge.exists():
              bridge.unlink()

      - name: Commit split
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/Modules/KhoVatLy
          git diff --cached --check
          git commit -m 'refactor(KhoVatLy): split MainStockSV into partial modules'
          git push origin HEAD:feature/baocao-tra-cuu
