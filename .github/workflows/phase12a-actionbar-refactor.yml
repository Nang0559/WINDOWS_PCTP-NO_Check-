name: Phase 12A action bar refactor

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor HVN_PGH action bar ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          text = path.read_text(encoding='utf-8-sig')

          replacements = [
          ('''            UIButton.AllowGlyphSkinning = false;
            UIButton.Buttons.Clear();
            UIButton.Buttons.AddRange(new WindowsUIButton[]
            {
        new WindowsUIButton { Caption = "Xóa Dòng Được Chọn", Style = ButtonStyle.PushButton, ImageUri = "Delete;Size16x16;Colored" },
        new WindowsUIButton { Caption = "Xóa Toàn Bộ Dữ Liệu", Style = ButtonStyle.PushButton, ImageUri = "clear;Size16x16;Colored"  },
        new WindowsUIButton { Caption = "Hoàn Thành",           Style = ButtonStyle.PushButton, ImageUri = "apply;Size16x16;Colored"  }
            });
            UIButton.Buttons.Insert(2, new WindowsUISeparator());
''', '''            _phieuActionBarControl.ConfigureDocQr();
'''),
          ('''            UIButton.AllowGlyphSkinning = false;
            UIButton.Buttons.Clear();
            var b1 = new WindowsUIButton
            {
                Caption = _cfg.Delivery.LoadTuBangRieng ? "Show Thông Tin Lệch IFS" : "Kiểm Tra Ghep Lot", // ← SỬA
                Style = ButtonStyle.PushButton,
                Image = imageBT.Images[1],
                Tag = "BTN_GHEPLOT_TOGGLE"   // ← THÊM
            };
            var b2 = new WindowsUIButton { Caption = "In Phiếu", Style = ButtonStyle.PushButton, ImageUri = "Print;Size16x16;Colored" };
            var b3 = new WindowsUIButton { Caption = "DOC QRCODE", Style = ButtonStyle.PushButton, ImageUri = "IndentIncrease;Size16x16;Colored" };

            UIButton.Buttons.AddRange(new WindowsUIButton[] { b3, b1, b2 });
            UIButton.Buttons.Insert(1, new WindowsUISeparator());
''', '''            _phieuActionBarControl.ConfigurePhieuView(
                _cfg.Delivery.LoadTuBangRieng ? "Show Thông Tin Lệch IFS" : "Kiểm Tra Ghep Lot",
                imageBT);
'''),
          ('''            UIButton.AllowGlyphSkinning = false;
            UIButton.Buttons.Clear();
            UIButton.Buttons.AddRange(new WindowsUIButton[]
    {
        new WindowsUIButton { Caption = "Upload Đơn Hàng",
            Style = ButtonStyle.PushButton,
            ImageUri = "Import;Size16x16;Colored" },
        new WindowsUIButton { Caption = "DOC QRCODE",
            Style = ButtonStyle.PushButton,
            ImageUri = "IndentIncrease;Size16x16;Colored" },
        new WindowsUIButton { Caption = "In Phiếu",
            Style = ButtonStyle.PushButton,
            ImageUri = "Print;Size16x16;Colored" }
            });
''', '''            _phieuActionBarControl.ConfigureGiaoDb();
''')]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Phase 12A replacement block not found')
              text = text.replace(old, new, 1)

          start = text.index('        public void SetupPhieuButtons(')
          end = text.index('\n        // ════════════════════════════════════════════════════════════════════\n        // III. ĐỌC GIÁ TRỊ TỪ UI', start)
          method = '''        public void SetupPhieuButtons(bool showCapNhapKho, bool showKiemTraMaNG,\n                                       bool showGhepLot, bool showDocQRCode,\n                                       bool showLayLaiLot = false,\n                                       bool showStop = false, bool showHangThieuCaNgay = true)\n        {\n            _phieuActionBarControl.ConfigureNormal(\n                _cfg.Delivery.LoadTuBangRieng\n                    ? "Show Thông Tin Lệch IFS"\n                    : "Kiểm Tra Ghep Lot",\n                showCapNhapKho,\n                showKiemTraMaNG,\n                showGhepLot,\n                showDocQRCode,\n                showLayLaiLot,\n                showStop,\n                showHangThieuCaNgay,\n                imageBT);\n        }\n'''
          text = text[:start] + method + text[end:]

          old = '''        public void SetupYMVNButtons()\n        {\n            UIButton.AllowGlyphSkinning = false;\n            UIButton.Buttons.Clear();\n\n            UIButton.Buttons.Add(new WindowsUIButton\n            {\n                Caption = "In Phiếu",\n                Style = ButtonStyle.PushButton,\n                ImageUri = "Print;Size16x16;Colored"\n            });\n\n            UIButton.Buttons.Add(new WindowsUIButton\n            {\n                Caption = _isLoaiSP ? "Đang xem: SP" : "Đang xem: MP",\n                Style = ButtonStyle.PushButton,\n                ImageUri = "Refresh;Size16x16;Colored"\n            });\n        }\n'''
          new = '''        public void SetupYMVNButtons()\n        {\n            _phieuActionBarControl.ConfigureYmvN(_isLoaiSP);\n        }\n'''
          if old not in text:
              raise SystemExit('SetupYMVNButtons block not found')
          text = text.replace(old, new, 1)

          old = '''                    // Cập nhật caption button trong UIButton\n                    foreach (var b in UIButton.Buttons.OfType<WindowsUIButton>())\n                    {\n                        if (b.Caption == "Đang xem: MP" || b.Caption == "Đang xem: SP")\n                        {\n                            b.Caption = _isLoaiSP ? "Đang xem: SP" : "Đang xem: MP";\n                            break;\n                        }\n                    }\n'''
          new = '''                    _phieuActionBarControl.UpdateLoaiPhieuCaption(_isLoaiSP);\n'''
          if old not in text:
              raise SystemExit('LoaiPhieu caption block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs .github/workflows/phase12a-actionbar-refactor.yml
          git diff --cached --quiet && exit 0
          git commit -m "refactor(giaohangkhach): move action bar configuration to control"
          git push
