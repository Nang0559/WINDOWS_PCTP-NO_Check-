name: PCTP QC Test Platform

on:
  push:
    branches:
      - feature/pctp-qc-test-platform
      - feature/wms-end-to-end-consistency
  pull_request:
    branches:
      - fix/qc-final-execution-timeout
      - feature/pctp-qc-test-platform
      - feature/wms-end-to-end-consistency
  workflow_dispatch:
    inputs:
      run_sql_integration:
        description: 'Run SQL integration tests on the isolated self-hosted SQL runner'
        required: true
        default: false
        type: boolean
      run_delivery_acceptance:
        description: 'Also run rollback-only Usp_Qrcode_Update_Stock2405 acceptance (needs a seeded pending row)'
        required: false
        default: false
        type: boolean
      delivery_acceptance_stt:
        description: 'TMPPHIEUGIAOHANG.STT of the dedicated seeded pending row'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pctp-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-regression-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate WinForms UI automation scripts parse
        shell: pwsh
        run: |
          $paths = @(
            ".\\PCTP.QC.UI\\Invoke-PctpUiSmoke.ps1",
            ".\\PCTP.QC.UI\\Invoke-PctpUiJourney.ps1",
            ".\\PCTP.QC.UI\\Invoke-PctpUiSuite.ps1",
            ".\\PCTP.QC.UI\\Invoke-PctpUiEvidenceSummary.ps1",
            ".\\PCTP.QC.UI\\PctpUi.Common.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "PowerShell parse failed: $path"
            }
            Write-Host "PASS: PowerShell syntax $path"
          }
      - name: Run isolated unit and regression tests
        run: dotnet test PCTP.QC.Tests/PCTP.QC.Tests.csproj --configuration Release --logger "trx;LogFileName=pctp-qc-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pctp-qc-test-results
          path: PCTP.QC.Tests/TestResults/*.trx
          if-no-files-found: ignore

  sql-engine-integration:
    # A disposable SQL Server container runs on GitHub-hosted infrastructure.
    # It has no route or credentials to SQL 57 / production SQL 14.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          SA_PASSWORD: PctpQc_CI_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PctpQc_CI_Only_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      PCTP_QC_ALLOW_EPHEMERAL_SQL: "true"
      PCTP_QC_EPHEMERAL_SQL_CONNECTION: "Server=127.0.0.1,1433;Initial Catalog=PCTP_QC_CI;User ID=sa;Password=PctpQc_CI_Only_2026!;Encrypt=True;TrustServerCertificate=True;Connect Timeout=5;Application Name=PCTP-QC-Ephemeral-CI"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Create isolated CI database
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "SQL Server service container was not found."
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PctpQc_CI_Only_2026!' -C -Q "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          docker exec "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PctpQc_CI_Only_2026!' -C -b -Q "IF DB_ID(N'PCTP_QC_CI') IS NULL CREATE DATABASE PCTP_QC_CI;"
      - name: Run isolated SQL Server engine integration
        run: dotnet run --project PCTP.QC.SqlIntegration/PCTP.QC.SqlIntegration.csproj --configuration Release -- --engine-only

  desktop-runner-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows desktop TestRunner
        run: dotnet build PCTP.QC.TestRunner/PCTP.QC.TestRunner.csproj --configuration Release
      - name: Build opt-in SQL integration harness (does not connect to SQL)
        run: dotnet build PCTP.QC.SqlIntegration/PCTP.QC.SqlIntegration.csproj --configuration Release
