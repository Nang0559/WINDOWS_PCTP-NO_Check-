name: PCTP QC Test Platform

on:
  push:
    branches:
      - feature/pctp-qc-test-platform
  pull_request:
    branches:
      - fix/qc-final-execution-timeout
      - feature/pctp-qc-test-platform
  workflow_dispatch:
    inputs:
      run_sql_integration:
        description: 'Run SQL integration tests on the isolated self-hosted SQL runner'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: pctp-qc-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  unit-regression-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python for one-shot normalization
        if: github.event_name == 'push'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Normalize current-stock status semantics
        if: github.event_name == 'push'
        shell: python
        run: |
          from pathlib import Path

          targets = {
              Path(r"PCTP/Modules/KhoCore/Repositories/SlotRepository.cs"): 2,
              Path(r"PCTP/Modules/KhoCore/Repositories/BulkStockSlotRepository.cs"): 1,
          }
          old = b"PhieuStatus <> 3"
          new = b"PhieuStatus = 0"

          for path, expected in targets.items():
              data = path.read_bytes()
              count = data.count(old)
              if count not in (0, expected):
                  raise SystemExit(f"{path}: unexpected {count} legacy status filters; expected 0 or {expected}")
              if count == expected:
                  path.write_bytes(data.replace(old, new))
                  print(f"Normalized {path}: {count} occurrence(s)")
              else:
                  print(f"Already normalized: {path}")
      - name: Commit normalized production queries
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $paths = @(
            '.\PCTP\Modules\KhoCore\Repositories\SlotRepository.cs',
            '.\PCTP\Modules\KhoCore\Repositories\BulkStockSlotRepository.cs'
          )
          $legacy = Select-String -Path $paths -Pattern 'PhieuStatus <> 3' -SimpleMatch
          if ($legacy) {
            $legacy | ForEach-Object { Write-Host $_.ToString() }
            throw 'Legacy current-stock status filter remains.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $diff = git status --short -- $paths
          if (-not $diff) {
            Write-Host 'No production status-filter changes required.'
            exit 0
          }
          git add -- $paths
          git commit -m 'fix(stock): enforce status-zero current stock paths'
          git push origin HEAD:feature/pctp-qc-test-platform
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run isolated unit and regression tests
        run: dotnet test PCTP.QC.Tests/PCTP.QC.Tests.csproj --configuration Release --logger "trx;LogFileName=pctp-qc-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pctp-qc-test-results
          path: PCTP.QC.Tests/TestResults/*.trx
          if-no-files-found: ignore


  sql-engine-integration:
    # The SQL test endpoint is private. Never expose it to a GitHub-hosted runner
    # and never point this job at production. Configure a dedicated self-hosted
    # Windows runner labelled pctp-qc-sql with network access only to the test DB.
    if: github.event_name == 'workflow_dispatch' && inputs.run_sql_integration == true
    runs-on: [self-hosted, windows, pctp-qc-sql]
    env:
      PCTP_QC_SQL_USER: ${{ secrets.PCTP_QC_SQL_USER }}
      PCTP_QC_SQL_PASSWORD: ${{ secrets.PCTP_QC_SQL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Require isolated SQL credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PCTP_QC_SQL_USER) -or [string]::IsNullOrWhiteSpace($env:PCTP_QC_SQL_PASSWORD)) {
            throw "Configure PCTP_QC_SQL_USER and PCTP_QC_SQL_PASSWORD secrets before running SQL integration."
          }
      - name: Run SQL integration harness
        shell: pwsh
        run: dotnet run --project PCTP.QC.SqlIntegration/PCTP.QC.SqlIntegration.csproj --configuration Release -- --user "$env:PCTP_QC_SQL_USER" --password "$env:PCTP_QC_SQL_PASSWORD"

  desktop-runner-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows desktop TestRunner
        run: dotnet build PCTP.QC.TestRunner/PCTP.QC.TestRunner.csproj --configuration Release
      - name: Build opt-in SQL integration harness (does not connect to SQL)
        run: dotnet build PCTP.QC.SqlIntegration/PCTP.QC.SqlIntegration.csproj --configuration Release