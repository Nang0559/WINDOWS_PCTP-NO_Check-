name: PCTP QC Test Platform

on:
  push:
    branches:
      - feature/pctp-qc-test-platform
  pull_request:
    branches:
      - fix/qc-final-execution-timeout
      - feature/pctp-qc-test-platform
  workflow_dispatch:
    inputs:
      run_sql_integration:
        description: 'Run SQL integration tests on the isolated self-hosted SQL runner'
        required: true
        default: false
        type: boolean
      run_delivery_acceptance:
        description: 'Also run rollback-only Usp_Qrcode_Update_Stock2405 acceptance (needs a seeded pending row)'
        required: false
        default: false
        type: boolean
      delivery_acceptance_stt:
        description: 'TMPPHIEUGIAOHANG.STT of the dedicated seeded pending row'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pctp-qc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-regression-tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate WinForms UI automation scripts parse
        shell: pwsh
        run: |
          $paths = @(
            ".\\PCTP.QC.UI\\Invoke-PctpUiSmoke.ps1",
            ".\\PCTP.QC.UI\\Invoke-PctpUiJourney.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Host
              throw "PowerShell parse failed: $path"
            }
            Write-Host "PASS: PowerShell syntax $path"
          }
      - name: Run isolated unit and regression tests
        run: dotnet test PCTP.QC.Tests/PCTP.QC.Tests.csproj --configuration Release --logger "trx;LogFileName=pctp-qc-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pctp-qc-test-results
          path: PCTP.QC.Tests/TestResults/*.trx
          if-no-files-found: ignore

  sql-engine-integration:
    # The SQL test endpoint is private. Never expose it to a GitHub-hosted runner
    # and never point this job at production. Configure a dedicated self-hosted
    # Windows runner labelled pctp-qc-sql with network access only to the test DB.
    if: github.event_name == 'workflow_dispatch' && inputs.run_sql_integration == true
    runs-on: [self-hosted, windows, pctp-qc-sql]
    timeout-minutes: 30
    env:
      PCTP_QC_SQL_USER: ${{ secrets.PCTP_QC_SQL_USER }}
      PCTP_QC_SQL_PASSWORD: ${{ secrets.PCTP_QC_SQL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Require isolated SQL credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PCTP_QC_SQL_USER) -or [string]::IsNullOrWhiteSpace($env:PCTP_QC_SQL_PASSWORD)) {
            throw "Configure PCTP_QC_SQL_USER and PCTP_QC_SQL_PASSWORD secrets before running SQL integration."
          }
      - name: Run SQL integration harness
        shell: pwsh
        run: dotnet run --project PCTP.QC.SqlIntegration/PCTP.QC.SqlIntegration.csproj --configuration Release -- --user "$env:PCTP_QC_SQL_USER" --password "$env:PCTP_QC_SQL_PASSWORD"

      - name: Run delivery stored-procedure acceptance (rollback-only, opt-in)
        if: inputs.run_delivery_acceptance == true
        shell: pwsh
        env:
          PCTP_QC_DEL_ACCEPTANCE_STT: ${{ inputs.delivery_acceptance_stt }}
        run: dotnet run --project PCTP.QC.SqlIntegration/PCTP.QC.SqlIntegration.csproj --configuration Release --no-build -- --user "$env:PCTP_QC_SQL_USER" --password "$env:PCTP_QC_SQL_PASSWORD" --delivery-acceptance

  desktop-runner-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows desktop TestRunner
        run: dotnet build PCTP.QC.TestRunner/PCTP.QC.TestRunner.csproj --configuration Release
      - name: Build opt-in SQL integration harness (does not connect to SQL)
        run: dotnet build PCTP.QC.SqlIntegration/PCTP.QC.SqlIntegration.csproj --configuration Release
