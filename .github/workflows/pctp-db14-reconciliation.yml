name: PCTP DB57 to DB14 SQL artifact

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Enter GENERATE-DB14-SQL to confirm read-only compare and SQL artifact generation
        required: true
        type: string
  push:
    branches: [feature/wms-live-data-test-harness]
    paths:
      - docs/PCTP_SQL_Runtime_Inventory_A-K.csv
      - SQL/QC_Schema/tools/db14_reconciliation.py
      - .github/workflows/pctp-db14-reconciliation.yml

permissions:
  contents: read
concurrency:
  group: pctp-db14-reconciliation
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'push' || inputs.confirm == 'GENERATE-DB14-SQL'
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PCTP_QC_SOURCE_SQL_CONNECTION: ${{ secrets.PCTP_QC_SOURCE_SQL_CONNECTION }}
      PCTP_QC_TARGET_SQL_CONNECTION: ${{ secrets.PCTP_QC_TARGET_SQL_CONNECTION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wms-live-data-test-harness
      - name: Validate secrets exist
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PCTP_QC_SOURCE_SQL_CONNECTION)) { throw 'Missing DB14 secret PCTP_QC_SOURCE_SQL_CONNECTION' }
          if ([string]::IsNullOrWhiteSpace($env:PCTP_QC_TARGET_SQL_CONNECTION)) { throw 'Missing DB57 secret PCTP_QC_TARGET_SQL_CONNECTION' }
      # Không dùng actions/setup-python trên self-hosted Windows: action này tự chạy setup.ps1 (không có chữ ký số)
      # nên bị chính sách PowerShell AllSigned của máy runner chặn. Thay bằng: dùng Python 3.11+ cài sẵn trên runner;
      # nếu chưa có thì tự cài bản chính thức (python.org, per-user, không cần admin) vào tool cache của runner (chỉ lần đầu),
      # rồi tạo venv riêng cho mỗi lần chạy.
      - name: Prepare Python 3.11+
        run: |
          # QUAN TRỌNG: runner tự chèn `$ErrorActionPreference = 'stop'` lên dòng 1 của file script (lỗi báo ở "line 8" dù
          # script chỉ có `$found` ở dòng 7). Với Windows PowerShell 5.1, 'stop' + `2>$null` làm stderr của lệnh native
          # (vd "py.exe: No installed Python found!") thành lỗi kết thúc -> job chết trước khi kịp thử `python`/cài mới.
          # Vì vậy phải ghi đè về 'Continue' trước mọi lệnh native; kiểm tra $LASTEXITCODE và dùng -ErrorAction Stop riêng.
          $ErrorActionPreference = 'Continue'
          $probeCode = 'import sys; print(sys.executable if sys.version_info >= (3, 11) else "")'

          function Test-Python([string]$exe, [string[]]$prefix) {
            $ErrorActionPreference = 'Continue'
            $found = & $exe @prefix '-c' $probeCode 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace("$found")) { return "$found".Trim() }
            return $null
          }

          $toolBase = if ($env:RUNNER_TOOL_CACHE) { $env:RUNNER_TOOL_CACHE } else { $env:RUNNER_TEMP }
          $toolRoot = Join-Path $toolBase 'pctp-python\3.11.9'
          $cached = Join-Path $toolRoot 'python.exe'
          $python = $null

          # 1) Bản đã tự cài ở lần chạy trước
          if (Test-Path $cached) { $python = Test-Python $cached @() }

          # 2) Python có sẵn trên máy runner
          if (-not $python) {
            foreach ($probe in @(@('py', '-3.11'), @('py', '-3.12'), @('py', '-3.13'), @('python'))) {
              $cmd = Get-Command $probe[0] -ErrorAction SilentlyContinue
              if (-not $cmd) { continue }
              $python = Test-Python $cmd.Source @($probe | Select-Object -Skip 1)
              if ($python) { break }
            }
          }

          # 3) Chưa có -> tải CPython 3.11.9 dạng gói NuGet (zip đầy đủ: python.exe + Lib + ensurepip) rồi giải nén vào tool cache.
          #    KHÔNG dùng installer .exe/.msi: runner này trả lỗi 1601 (dịch vụ Windows Installer không truy cập được) khi cài.
          if (-not $python) {
            Write-Host 'No Python 3.11+ found on this runner. Downloading CPython 3.11.9 (NuGet package, no installer) ...'
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $ProgressPreference = 'SilentlyContinue'
            $pyBase = Split-Path $toolRoot -Parent
            $stage = Join-Path $pyBase 'stage'
            $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-nuget.zip'
            foreach ($path in @($stage, $toolRoot)) { if (Test-Path $path) { Remove-Item -Recurse -Force $path -ErrorAction Stop } }
            New-Item -ItemType Directory -Force -Path $pyBase | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.nuget.org/api/v2/package/python/3.11.9' -OutFile $zip -ErrorAction Stop
            Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force -ErrorAction Stop
            if (-not (Test-Path (Join-Path $stage 'tools\python.exe'))) { throw 'NuGet package python 3.11.9 has no tools\python.exe (unexpected layout).' }
            Move-Item -LiteralPath (Join-Path $stage 'tools') -Destination $toolRoot -ErrorAction Stop
            Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
            # Chỉ chấp nhận python.exe do Python Software Foundation ký số.
            $sig = Get-AuthenticodeSignature -FilePath $cached -ErrorAction Stop
            if ($sig.Status -ne 'Valid' -or "$($sig.SignerCertificate.Subject)" -notmatch 'Python Software Foundation') {
              Remove-Item -Recurse -Force $toolRoot -ErrorAction SilentlyContinue
              throw "Unexpected python.exe signature: $($sig.Status) / $($sig.SignerCertificate.Subject)"
            }
            $python = Test-Python $cached @()
            if ($python) {
              # venv cần ensurepip; kiểm tra sớm để báo lỗi rõ ràng thay vì lỗi khó hiểu ở bước tạo venv.
              & $python -c 'import venv, ensurepip' 2>$null
              if ($LASTEXITCODE -ne 0) { $python = $null; Write-Host 'Downloaded Python has no venv/ensurepip.' }
            }
          }

          if (-not $python) {
            throw 'Python 3.11+ is unavailable and the automatic download failed (needs access to www.nuget.org). Install Python 3.11+ on the runner machine (python.org, "Install for all users", Add python.exe to PATH; if the Windows Installer service is blocked, enable it first), then restart the runner service.'
          }

          & $python --version
          $venv = Join-Path $env:RUNNER_TEMP 'pctp-db14-venv'
          if (Test-Path $venv) { Remove-Item -Recurse -Force $venv -ErrorAction Stop }
          & $python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "Cannot create virtualenv at $venv" }
          # Các bước sau gọi `python` -> trỏ vào venv này (không cần Activate.ps1, không bị AllSigned chặn).
          Join-Path $venv 'Scripts' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append -ErrorAction Stop
          $global:LASTEXITCODE = 0
      - name: Verify SQL ODBC driver
        run: |
          if (-not (Get-OdbcDriver | Where-Object Name -eq 'ODBC Driver 18 for SQL Server')) {
            throw 'Install Microsoft ODBC Driver 18 for SQL Server on the self-hosted runner before running this workflow.'
          }
      # Các bước dưới gọi lệnh native: hạ 'stop' (runner chèn) về 'Continue' và tự trả mã thoát để lỗi thật (pip/test/generator
      # exit != 0) luôn làm fail job, còn stderr thường (unittest in kết quả ra stderr) không làm hỏng bước.
      - name: Install pyodbc
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pip install --disable-pip-version-check pyodbc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test generator
        run: |
          $ErrorActionPreference = 'Continue'
          python -m unittest discover -s SQL/QC_Schema/tools -p 'test_db14_reconciliation.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate artifact (read-only; no database writes)
        run: |
          $ErrorActionPreference = 'Continue'
          python SQL/QC_Schema/tools/db14_reconciliation.py --out artifacts/db14-reconciliation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: DB14-Reconciliation-${{ github.run_number }}
          path: artifacts/db14-reconciliation/
          if-no-files-found: error
          retention-days: 30
