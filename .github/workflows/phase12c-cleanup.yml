name: Phase 12C DOC QR cleanup

on:
  push:
    paths:
      - '.github/workflows/phase12c-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move DOC QR UI state into DocQrControl
        shell: python
        run: |
          from pathlib import Path

          control_path = Path('PCTP/Modules/GiaoHangKhach/HVN/Controls/DocQrControl.cs')
          form_path = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          roadmap_path = Path('PCTP/Workflow/Diagram/GIAOHANGKHACH_REFACTOR_ROADMAP.md')

          control = control_path.read_text(encoding='utf-8')
          marker = '        /// <summary>\n        /// Moves the existing DOCQRCODE GridControl into this UserControl'
          insert = '''        public int GetFocusedStt()\n        {\n            if (QrView == null || QrView.FocusedRowHandle < 0)\n                return -1;\n\n            string value = QrView.GetFocusedRowCellDisplayText("STT");\n            return int.TryParse(value, out int stt) ? stt : -1;\n        }\n\n        public (string LotFcc, int SlFcc, int SlHvn) GetFocusedTemInfo()\n        {\n            if (QrView == null || QrView.FocusedRowHandle < 0)\n                return (string.Empty, 0, 0);\n\n            string lot = QrView.GetFocusedRowCellDisplayText("LOTFCC");\n            int.TryParse(QrView.GetFocusedRowCellDisplayText("SLTEMFCC"), out int slFcc);\n            int.TryParse(QrView.GetFocusedRowCellDisplayText("SLTEMHVN"), out int slHvn);\n            return (lot, slFcc, slHvn);\n        }\n\n        public void DeleteFocusedRow()\n        {\n            if (QrView == null)\n                return;\n\n            QrView.DeleteSelectedRows();\n        }\n\n        public void ClearRows()\n        {\n            if (QrGrid == null)\n                return;\n\n            QrGrid.DataSource = null;\n        }\n\n'''
          if 'public int GetFocusedStt()' not in control:
              control = control.replace(marker, insert + marker, 1)
              control_path.write_text(control, encoding='utf-8')

          form = form_path.read_text(encoding='utf-8')
          old = '''        public int GetFocusedDocQRStt()\n        {\n            string s = gridVDOCQRCODE.GetFocusedRowCellDisplayText("STT");\n            return int.TryParse(s, out int v) ? v : -1;\n        }\n\n        public (string LotFcc, int SlFcc, int SlHvn) GetFocusedDocQRTemInfo()\n        {\n            string lot = gridVDOCQRCODE.GetFocusedRowCellDisplayText("LOTFCC");\n            int.TryParse(gridVDOCQRCODE.GetFocusedRowCellDisplayText("SLTEMFCC"), out int slFcc);\n            int.TryParse(gridVDOCQRCODE.GetFocusedRowCellDisplayText("SLTEMHVN"), out int slHvn);\n            return (lot, slFcc, slHvn);\n        }\n\n        public void DeleteFocusedDocQRRow() => gridVDOCQRCODE.DeleteSelectedRows();\n\n        public void ClearDocQRRows() => gridCtrDOCQrCODE.DataSource = null;\n'''
          new = '''        public int GetFocusedDocQRStt()\n            => _docQrControl != null ? _docQrControl.GetFocusedStt() : -1;\n\n        public (string LotFcc, int SlFcc, int SlHvn) GetFocusedDocQRTemInfo()\n            => _docQrControl != null\n                ? _docQrControl.GetFocusedTemInfo()\n                : (string.Empty, 0, 0);\n\n        public void DeleteFocusedDocQRRow()\n        {\n            if (_docQrControl != null)\n                _docQrControl.DeleteFocusedRow();\n        }\n\n        public void ClearDocQRRows()\n        {\n            if (_docQrControl != null)\n                _docQrControl.ClearRows();\n        }\n'''
          if old not in form:
              raise SystemExit('Expected DOC QR legacy block not found')
          form = form.replace(old, new, 1)
          form_path.write_text(form, encoding='utf-8')

          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap = roadmap.replace('| 12C | DOC QR UI/actions | ⬜ Chưa bắt đầu |', '| 12C | DOC QR UI/actions | ✅ Hoàn thành |', 1)
          section = '''**Trạng thái: ⬜ Chưa bắt đầu**\n\nChuyển các thao tác UI DOC QR còn lại vào `DocQrControl`:\n'''
          replacement = '''**Trạng thái: ✅ Hoàn thành**\n\nĐã chuyển ownership của các thao tác UI DOC QR còn lại vào `DocQrControl`:\n\n```text\nGetFocusedStt\nGetFocusedTemInfo\nDeleteFocusedRow\nClearRows\n```\n\n`HVN_PGH` chỉ còn facade gọi `DocQrControl`; không còn implementation trực tiếp đọc/xóa/xóa toàn bộ DOC QR grid trong form.\n\nMigration boundary vẫn giữ `gridCtrDOCQrCODE` / `gridVDOCQRCODE` để `Adopt()` tiếp quản control do Designer tạo.\n'''
          if section not in roadmap:
              raise SystemExit('Expected Phase 12C roadmap section not found')
          roadmap = roadmap.replace(section, replacement, 1)
          roadmap_path.write_text(roadmap, encoding='utf-8')

      - name: Commit Phase 12C and remove temporary automation
        run: |
          rm -f .github/workflows/phase12c-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/Modules/GiaoHangKhach/HVN/Controls/DocQrControl.cs PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs PCTP/Workflow/Diagram/GIAOHANGKHACH_REFACTOR_ROADMAP.md .github/workflows/phase12c-cleanup.yml
          git commit -m 'refactor(giaohangkhach): complete phase 12C DOC QR cleanup'
          git push origin HEAD:master
