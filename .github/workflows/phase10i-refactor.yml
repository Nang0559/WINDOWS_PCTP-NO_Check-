name: phase10i-refactor
on:
  push:
    paths:
      - '.github/workflows/phase10i-refactor.yml'
jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase 10I
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Header control owns the radio/date/tab event interpretation.
          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs',
              '        private bool _isLoaiSP;\n        private bool _eventsWired;',
              '        private bool _isLoaiSP;\n        private bool _eventsWired;\n        private CustomerConfig _cfg;')

          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs',
              '        public bool IsLoaiSP\n        {\n            get { return _isLoaiSP; }\n        }',
              '        public bool IsLoaiSP\n        {\n            get { return _isLoaiSP; }\n        }\n\n        public GioXuat CurrentGioXuat { get; private set; }\n\n        public DateTime SelectedDate\n        {\n            get\n            {\n                var date = FindControl<DateEdit>("dateNX");\n                return date != null ? date.DateTime : DateTime.MinValue;\n            }\n        }')

          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs',
              '            if (cfg == null || cfg.Delivery == null || _content == null)\n                return;\n\n            var tabPaneControl',
              '            if (cfg == null || cfg.Delivery == null || _content == null)\n                return;\n\n            _cfg = cfg;\n\n            var tabPaneControl')

          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs',
              '        private void HeaderDateChanged(object sender, EventArgs e)\n        {\n            DateChanged.Invoke(sender, e);\n        }\n\n        private void HeaderGioXuatChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(sender, e);\n        }\n\n        private void HeaderTabChanged(object sender, EventArgs e)\n        {\n            TabChanged.Invoke(sender, e);\n        }',
              '        private void HeaderDateChanged(object sender, EventArgs e)\n        {\n            DateChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void HeaderGioXuatChanged(object sender, EventArgs e)\n        {\n            if (!TryUpdateCurrentGioXuat())\n                return;\n\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void HeaderTabChanged(object sender, EventArgs e)\n        {\n            TabChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private bool TryUpdateCurrentGioXuat()\n        {\n            if (_cfg == null || _cfg.Delivery == null)\n                return false;\n\n            if (!_cfg.Delivery.CoNhieuNhaMay)\n                return TryReadGioXuat(FindControl<RadioGroup>("radioGroup2"));\n\n            var tabPane = FindControl<TabPane>("tabPaneHVN");\n            var tabHn = FindControl<NavigationPage>("tabHN");\n            return tabPane != null && tabHn != null && tabPane.SelectedPage == tabHn\n                ? TryReadGioXuat(FindControl<RadioGroup>("RDO_GXHN"))\n                : TryReadGioXuat(FindControl<RadioGroup>("radioGroup2"));\n        }\n\n        private bool TryReadGioXuat(RadioGroup radio)\n        {\n            if (radio == null)\n                return false;\n\n            int idx = radio.SelectedIndex;\n            if (idx < 0 || idx >= radio.Properties.Items.Count)\n                return false;\n\n            var item = radio.Properties.Items[idx] as RadioGroupItem;\n            if (item == null)\n                return false;\n\n            string ma = item.AccessibleName ?? "'06'";\n            string moTa = item.Description ?? "(6H)";\n            CurrentGioXuat = new GioXuat(ma, moTa);\n            return true;\n        }')

          # Expose the header-owned selection through the specialized view contract.
          replace(
              'PCTP/Presentation/Views/IPhieuView.cs',
              '        DateTime SelectedDate { get; }\n        int SelectedTabAddNM { get; }',
              '        DateTime SelectedDate { get; }\n        int SelectedTabAddNM { get; }\n        GioXuat CurrentGioXuat { get; }')

          # Form only bridges the specialized header event; no longer interprets radio state.
          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs',
              '        private void PhieuHeaderControl_GioXuatChanged(object sender, EventArgs e)\n        {\n            if (ReferenceEquals(sender, RDO_GXHN))\n                RDO_GXHN_SelectedIndexChanged(sender, e);\n            else if (ReferenceEquals(sender, radioGroup2))\n                radioGroup2_SelectedIndexChanged(sender, e);\n            else\n            {\n                // The header control intentionally normalizes both radio groups\n                // into one event. Preserve the legacy handler routing by using\n                // the currently visible/active group.\n                if (RDO_GXHN != null && RDO_GXHN.Visible)\n                    RDO_GXHN_SelectedIndexChanged(RDO_GXHN, e);\n                else\n                    radioGroup2_SelectedIndexChanged(radioGroup2, e);\n            }\n        }',
              '        private void PhieuHeaderControl_GioXuatChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }')

          # Keep the legacy form handlers as compatibility entry points, but delegate selection interpretation.
          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs',
              '        private void RDO_GXHN_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            UpdateGioXuatFromRadio();\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void radioGroup2_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            UpdateGioXuatFromRadio();\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }',
              '        private void RDO_GXHN_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void radioGroup2_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }')

          # Remove the old radio-selection implementation; presenter reads CurrentGioXuat from IPhieuView.
          old_start = '        private void UpdateGioXuatFromRadio()\n        {\n'
          start = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs').read_text(encoding='utf-8')
          a = start.find(old_start)
          if a < 0:
              raise SystemExit('UpdateGioXuatFromRadio not found')
          marker = '        // ── GIAO DB guard'
          b = start.find(marker, a)
          if b < 0:
              raise SystemExit('GIAO DB marker not found')
          p = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          p.write_text(start[:a] + start[b:], encoding='utf-8')

          # The presenter now synchronizes the context from the specialized view-owned value.
          replace(
              'PCTP/Presentation/Presenters/PhieuPresenter.cs',
              '        private void OnGioXuatChanged(object sender, EventArgs e) => _c.RunWithLoading(() => {',
              '        private void OnGioXuatChanged(object sender, EventArgs e) { _c.UpdateGioXuat(_v.CurrentGioXuat); _c.RunWithLoading(() => {')
          replace(
              'PCTP/Presentation/Presenters/PhieuPresenter.cs',
              '}, "Chuyển giờ xuất...");\n        private void OnCapNhapKho',
              '}, "Chuyển giờ xuất..."); }\n        private void OnCapNhapKho')

          # HVN_PGH delegates the specialized view property to the header control.
          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs',
              '        public bool IsLoaiSP => _phieuHeaderControl != null && _phieuHeaderControl.IsLoaiSP;',
              '        public bool IsLoaiSP => _phieuHeaderControl != null && _phieuHeaderControl.IsLoaiSP;\n        public GioXuat CurrentGioXuat => _phieuHeaderControl != null ? _phieuHeaderControl.CurrentGioXuat : null;')

          # Use the new ownership API from the form.
          replace(
              'PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs',
              '            _phieuHeaderControl.ConfigureCustomer(\n                cfg,\n                tabPaneHVN,\n                tabVP,\n                tabHN,\n                radioGroup2,\n                RDO_GXHN,\n                CheckGX,\n                btnUploadMilkrun);',
              '            _phieuHeaderControl.ConfigureCustomer(cfg);')

          # Remove temporary workflow after committing the refactor.
          Path('.github/workflows/phase10i-refactor.yml').unlink()

          import subprocess
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','.'], check=True)
          subprocess.run(['git','commit','-m','Phase 10I: move header event interpretation into PhieuHeaderControl'], check=True)
          subprocess.run(['git','push'], check=True)
