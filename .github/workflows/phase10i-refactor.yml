name: phase10i-refactor
on:
  push:
jobs:
  refactor:
    if: github.actor == 'Nang0559' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Phase 10I
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          # 1. Header control owns the selected hour interpretation.
          p = 'PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs'
          s = text(p)
          if 'private CustomerConfig _cfg;' not in s:
              s = s.replace('        private bool _eventsWired;', '        private bool _eventsWired;\n        private CustomerConfig _cfg;', 1)
          if 'public GioXuat CurrentGioXuat' not in s:
              needle = '        public bool IsLoaiSP\n        {\n            get { return _isLoaiSP; }\n        }'
              repl = needle + '\n\n        public GioXuat CurrentGioXuat { get; private set; }'
              s = s.replace(needle, repl, 1)
          if '            _cfg = cfg;' not in s:
              s = s.replace('            if (cfg == null || cfg.Delivery == null || _content == null)\n                return;\n\n            var tabPaneControl', '            if (cfg == null || cfg.Delivery == null || _content == null)\n                return;\n\n            _cfg = cfg;\n\n            var tabPaneControl', 1)
          old = '''        private void HeaderDateChanged(object sender, EventArgs e)\n        {\n            DateChanged.Invoke(sender, e);\n        }\n\n        private void HeaderGioXuatChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(sender, e);\n        }\n\n        private void HeaderTabChanged(object sender, EventArgs e)\n        {\n            TabChanged.Invoke(sender, e);\n        }'''
          new = '''        private void HeaderDateChanged(object sender, EventArgs e)\n        {\n            DateChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void HeaderGioXuatChanged(object sender, EventArgs e)\n        {\n            if (!TryUpdateCurrentGioXuat())\n                return;\n\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void HeaderTabChanged(object sender, EventArgs e)\n        {\n            TabChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private bool TryUpdateCurrentGioXuat()\n        {\n            if (_cfg == null || _cfg.Delivery == null)\n                return false;\n\n            if (!_cfg.Delivery.CoNhieuNhaMay)\n                return TryReadGioXuat(FindControl<RadioGroup>("radioGroup2"));\n\n            var tabPane = FindControl<TabPane>("tabPaneHVN");\n            var tabHn = FindControl<NavigationPage>("tabHN");\n            return tabPane != null && tabHn != null && tabPane.SelectedPage == tabHn\n                ? TryReadGioXuat(FindControl<RadioGroup>("RDO_GXHN"))\n                : TryReadGioXuat(FindControl<RadioGroup>("radioGroup2"));\n        }\n\n        private bool TryReadGioXuat(RadioGroup radio)\n        {\n            if (radio == null)\n                return false;\n\n            int idx = radio.SelectedIndex;\n            if (idx < 0 || idx >= radio.Properties.Items.Count)\n                return false;\n\n            var item = radio.Properties.Items[idx] as RadioGroupItem;\n            if (item == null)\n                return false;\n\n            string ma = item.AccessibleName ?? "'06'";\n            string moTa = item.Description ?? "(6H)";\n            CurrentGioXuat = new GioXuat(ma, moTa);\n            return true;\n        }'''
          if old in s:
              s = s.replace(old, new, 1)
          write(p, s)

          # 2. Specialized view exposes the value owned by the header control.
          p = 'PCTP/Presentation/Views/IPhieuView.cs'
          s = text(p)
          if 'GioXuat CurrentGioXuat { get; }' not in s:
              s = s.replace('        DateTime SelectedDate { get; }\n        int SelectedTabAddNM { get; }', '        DateTime SelectedDate { get; }\n        int SelectedTabAddNM { get; }\n        GioXuat CurrentGioXuat { get; }', 1)
          write(p, s)

          # 3. HVN_PGH delegates the property and uses the new configuration API.
          p = 'PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs'
          s = text(p)
          if 'public GioXuat CurrentGioXuat =>' not in s:
              s = s.replace('        public bool IsLoaiSP => _phieuHeaderControl != null && _phieuHeaderControl.IsLoaiSP;', '        public bool IsLoaiSP => _phieuHeaderControl != null && _phieuHeaderControl.IsLoaiSP;\n        public GioXuat CurrentGioXuat => _phieuHeaderControl != null ? _phieuHeaderControl.CurrentGioXuat : null;', 1)
          s = s.replace('            _phieuHeaderControl.ConfigureCustomer(\n                cfg,\n                tabPaneHVN,\n                tabVP,\n                tabHN,\n                radioGroup2,\n                RDO_GXHN,\n                CheckGX,\n                btnUploadMilkrun);', '            _phieuHeaderControl.ConfigureCustomer(cfg);', 1)
          # Remove the old selection interpreter if still present.
          s = re.sub(r'        private void UpdateGioXuatFromRadio\(\)\n        \{.*?\n        \}\n\n        // ── GIAO DB guard', '        // ── GIAO DB guard', s, count=1, flags=re.S)
          s = s.replace('''        private void RDO_GXHN_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            UpdateGioXuatFromRadio();\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void radioGroup2_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            UpdateGioXuatFromRadio();\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }''', '''        private void RDO_GXHN_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }\n\n        private void radioGroup2_SelectedIndexChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }''', 1)
          write(p, s)

          # 4. Migration bridge forwards only the specialized event.
          p = 'PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.PhieuGridMigration.cs'
          s = text(p)
          s = re.sub(r'        private void PhieuHeaderControl_GioXuatChanged\(object sender, EventArgs e\)\n        \{.*?\n        \}', '        private void PhieuHeaderControl_GioXuatChanged(object sender, EventArgs e)\n        {\n            GioXuatChanged.Invoke(this, EventArgs.Empty);\n        }', s, count=1, flags=re.S)
          write(p, s)

          # 5. Presenter synchronizes context from the specialized view before loading.
          p = 'PCTP/Presentation/Presenters/PhieuPresenter.cs'
          s = text(p)
          pattern = r'        private void OnGioXuatChanged\(object sender, EventArgs e\).*?(?=        private void OnCapNhapKho)'
          replacement = '''        private void OnGioXuatChanged(object sender, EventArgs e)\n        {\n            _c.UpdateGioXuat(_v.CurrentGioXuat);\n            _c.RunWithLoading(() =>\n            {\n                if (_c.Cfg.Delivery.CoGear)\n                {\n                    _c.LoadPhieuHienTai();\n                    return;\n                }\n                if (_c.GioXuatHienTai.Ma == "#")\n                {\n                    _c.UiContext.Post(_ => _c.LoadPhieuGiaoDB(), null);\n                    return;\n                }\n                _c.UiContext.Send(_ => _c.Bus.Publish(new GioXuatChangedEvent(_c.GioXuatHienTai, _c.AddNM)), null);\n                _c.LoadPhieuHienTai();\n            }, "Chuyển giờ xuất...");\n        }\n'''
          ns, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('OnGioXuatChanged pattern not found')
          write(p, ns)

          # 6. Remove trigger marker and this workflow, then commit.
          Path('PCTP/Modules/GiaoHangKhach/HVN/.phase10i-trigger').unlink(missing_ok=True)
          Path('.github/workflows/phase10i-refactor.yml').unlink()
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','.'], check=True)
          subprocess.run(['git','commit','-m','Phase 10I: move header event interpretation into PhieuHeaderControl'], check=True)
          subprocess.run(['git','push'], check=True)
