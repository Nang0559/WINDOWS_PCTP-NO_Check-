name: inspect-100001-sp
on:
  push:
    branches: [feature/baocao-deliverytrace-refactor]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        shell: bash
        run: |
          echo '--- CustomerTableConfig ---'
          grep -n -C 12 -E '100001|100002|Purchase_Order_HVNDB|Purchase_Order_YMVN|DocQRTableSP' PCTP/Shared/Models/CustomerTableConfig.cs || true
          echo '--- SP/MP references ---'
          grep -R -n -E 'XEM MP|XEM SP|LoaiSP|IsLoaiSP|DocQRTableSP|DOCKCODE|DockCode|Dockcode' PCTP/Modules/GiaoHangKhach PCTP/Shared/Models 2>/dev/null | head -n 300 || true
          echo '--- IFS references ---'
          grep -R -n -E 'IFS|Purchase_Order_HVNDB' PCTP/Modules/GiaoHangKhach PCTP/Infrastructure PCTP/Domain 2>/dev/null | head -n 300 || true
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/inspect-100001-sp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-100001-sp.yml
          git diff --cached --quiet || git commit -m 'chore(giaohangkhach): remove temporary inspection workflow'
          git push