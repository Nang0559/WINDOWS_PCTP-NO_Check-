name: Phase 12B Cleanup

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Phase 12B ownership cleanup
        run: |
          python3 <<'PY'
          from pathlib import Path

          hvn_path = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          grid_path = Path('PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuGridControl.cs')
          hvn = hvn_path.read_text(encoding='utf-8')
          grid = grid_path.read_text(encoding='utf-8')

          marker = '''        public bool HasUnconfirmedRows()\n        {\n            if (GridViewDONHANG.RowCount == 0)\n                return false;\n\n            for (int i = 0; i < GridViewDONHANG.RowCount; i++)\n            {\n                if (GridViewDONHANG.GetRowCellDisplayText(i, "STATUS").Trim() != "OK")\n                    return true;\n            }\n            return false;\n        }\n'''
          addition = marker + '''\n        public void RefreshLotRow(int stt, string lot)\n        {\n            for (int i = 0; i < GridViewDONHANG.RowCount; i++)\n            {\n                string sttStr = GridViewDONHANG.GetRowCellDisplayText(i, "STT").Trim();\n                int rowStt;\n                if (!int.TryParse(sttStr, out rowStt) || rowStt != stt)\n                    continue;\n\n                GridViewDONHANG.SetRowCellValue(i, "LOT", lot);\n                GridViewDONHANG.RefreshRow(i);\n                return;\n            }\n        }\n'''
          if 'public void RefreshLotRow(int stt, string lot)' not in grid:
              if marker not in grid:
                  raise SystemExit('12B: PhieuGridControl insertion point not found')
              grid = grid.replace(marker, addition, 1)

          replacements = [
              ('''        public void RefreshLotRow(int stt, string lot)\n        {\n            for (int i = 0; i < GridViewDONHANG.RowCount; i++)\n            {\n                string sttStr = GridViewDONHANG.GetRowCellDisplayText(i, "STT").Trim();\n                if (!int.TryParse(sttStr, out int rowStt) || rowStt != stt) continue;\n\n                GridViewDONHANG.SetRowCellValue(i, "LOT", lot);\n\n                // ── THÊM: refresh dòng ngay để màu green hiện lên ──\n                GridViewDONHANG.RefreshRow(i);\n                return;\n            }\n        }\n''', '''        public void RefreshLotRow(int stt, string lot)\n            => _phieuGridControl.RefreshLotRow(stt, lot);\n'''),
              ('''        public string GetFocusedDonHangMaHang() =>\n            GridViewDONHANG.GetFocusedRowCellDisplayText("MAHANG").Trim();\n''', '''        public string GetFocusedDonHangMaHang()\n            => _phieuGridControl.GetFocusedMaHang();\n'''),
              ('''        public bool CoLotDeLuuKho()\n        {\n            for (int i = 0; i < GridViewDONHANG.RowCount; i++)\n                if (GridViewDONHANG.GetRowCellDisplayText(i, "LOT").Trim() != "")\n                    return true;\n            return false;\n        }\n''', '''        public bool CoLotDeLuuKho()\n            => _phieuGridControl.HasLotToSave();\n'''),
              ('''        public bool CoHangChuaOK()\n        {\n            if (GridViewDONHANG.RowCount == 0) return false;\n            for (int i = 0; i < GridViewDONHANG.RowCount; i++)\n                if (GridViewDONHANG.GetRowCellDisplayText(i, "STATUS").Trim() != "OK")\n                    return true;\n            return false;\n        }\n''', '''        public bool CoHangChuaOK()\n            => _phieuGridControl.HasUnconfirmedRows();\n'''),
              ('''        private int GetFocusedDonHangStt()\n        {\n            string s = GridViewDONHANG.GetFocusedRowCellDisplayText("STT");\n            return int.TryParse(s, out int v) ? v : -1;\n        }\n''', '''        private int GetFocusedDonHangStt()\n            => _phieuGridControl.GetFocusedStt();\n''')
          ]
          for old, new in replacements:
              if old in hvn:
                  hvn = hvn.replace(old, new, 1)

          # The LOT/status reads used by action handling are already routed through the control;
          # route the remaining editor reads without changing business behavior.
          hvn = hvn.replace('''string status = GridViewDONHANG\n                    .GetFocusedRowCellDisplayText("STATUS").Trim();''', 'string status = _phieuGridControl.GetFocusedStatus();', 1)
          hvn = hvn.replace('''string maHang = GridViewDONHANG\n                    .GetFocusedRowCellDisplayText("MAHANG").Trim();''', 'string maHang = _phieuGridControl.GetFocusedMaHang();', 1)

          hvn_path.write_text(hvn, encoding='utf-8')
          grid_path.write_text(grid, encoding='utf-8')
          PY

      - name: Commit Phase 12B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuGridControl.cs
          git diff --cached --quiet && exit 0
          git commit -m "refactor(giaohangkhach): complete phase 12B grid ownership cleanup"
          git push
