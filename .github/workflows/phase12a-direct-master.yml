name: Phase 12A Direct Master

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  extract-action-bar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract action bar ownership
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          text = path.read_text(encoding='utf-8')

          def replace_range(start_marker, start_offset, end_marker, replacement, label):
              global text
              start = text.index(start_marker) + start_offset
              end = text.index(end_marker, start)
              text = text[:start] + replacement + text[end:]

          # SwitchToDocQRView: remove only the action-bar construction.
          method = text.index('public void SwitchToDocQRView()')
          a = text.index('            UIButton.AllowGlyphSkinning = false;', method)
          b = text.index('            txt_DOCQRCODE.Focus();', a) + len('            txt_DOCQRCODE.Focus();')
          text = text[:a] + '            _phieuActionBarControl.ConfigureDocQr();\n\n            txt_DOCQRCODE.Focus();' + text[b:]

          # SwitchToPhieuView: remove only the action-bar construction.
          method = text.index('public void SwitchToPhieuView()')
          a = text.index('            UIButton.AllowGlyphSkinning = false;', method)
          b = text.index('            UIButton.Buttons.Insert(1, new WindowsUISeparator());', a) + len('            UIButton.Buttons.Insert(1, new WindowsUISeparator());')
          text = text[:a] + '''            _phieuActionBarControl.ConfigurePhieuView(\n                _cfg.Delivery.LoadTuBangRieng ? "Show Thông Tin Lệch IFS" : "Kiểm Tra Ghep Lot",\n                imageBT.Images);''' + text[b:]

          # GiaoDB view.
          method = text.index('public void SwitchToPhieuDBView()')
          body_start = text.index('{', method) + 1
          body_end = text.index('\n        }', body_start)
          text = text[:body_start] + '''\n            _phieuActionBarControl.ConfigureGiaoDb();''' + text[body_end:]

          # Normal ticket action-bar configuration.
          method = text.index('public void SetupPhieuButtons(')
          body_start = text.index('{', method) + 1
          body_end = text.index('\n        }', body_start)
          text = text[:body_start] + '''\n            _phieuActionBarControl.ConfigureNormal(\n                _cfg.Delivery.LoadTuBangRieng ? "Show Thông Tin Lệch IFS" : "Kiểm Tra Ghep Lot",\n                showCapNhapKho,\n                showKiemTraMaNG,\n                showGhepLot,\n                showDocQRCode,\n                showLayLaiLot,\n                showStop,\n                showHangThieuCaNgay,\n                imageBT.Images);''' + text[body_end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit extracted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs
          git diff --cached --quiet && exit 0
          git commit -m "Phase 12A: extract action bar"
          git push
