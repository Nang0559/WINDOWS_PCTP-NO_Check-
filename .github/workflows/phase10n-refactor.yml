name: phase10n-refactor
on:
  push:
    paths:
      - '.github/phase10n.trigger'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor header UI ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path('PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs')
          p = header.read_text(encoding='utf-8-sig')

          marker = '''        public void SetDate(DateTime date)\n        {'''
          insert = '''        public DateTime SelectedDate\n        {\n            get\n            {\n                var control = FindControl<DateEdit>("dateNX");\n                return control != null ? control.DateTime : DateTime.MinValue;\n            }\n        }\n\n        public int SelectedTabAddNM\n        {\n            get\n            {\n                if (_cfg == null || _cfg.Delivery == null)\n                    return 1;\n\n                if (!_cfg.Delivery.CoNhieuNhaMay)\n                    return _cfg.Delivery.AddNmMacDinh;\n\n                var tabPane = FindControl<TabPane>("tabPaneHVN");\n                var tabHn = FindControl<NavigationPage>("tabHN");\n                return tabPane != null && tabHn != null && tabPane.SelectedPage == tabHn ? 2 : 1;\n            }\n        }\n\n        public void SetTab(int addNM)\n        {\n            var tabPane = FindControl<TabPane>("tabPaneHVN");\n            var tabVp = FindControl<NavigationPage>("tabVP");\n            var tabHn = FindControl<NavigationPage>("tabHN");\n            if (tabPane == null || tabVp == null || tabHn == null)\n                return;\n\n            if (addNM == 2)\n            {\n                tabPane.SelectedPage = tabHn;\n                tabVp.PageVisible = false;\n            }\n            else\n            {\n                tabPane.SelectedPage = tabVp;\n                tabHn.PageVisible = false;\n            }\n        }\n\n        public void LockDatePicker()\n        {\n            var control = FindControl<DateEdit>("dateNX");\n            if (control != null)\n                control.Enabled = false;\n        }\n\n        public void UnlockDatePicker()\n        {\n            var control = FindControl<DateEdit>("dateNX");\n            if (control != null)\n                control.Enabled = true;\n        }\n\n'''
          if 'public DateTime SelectedDate' not in p:
              if marker not in p:
                  raise SystemExit('Header insertion marker not found')
              p = p.replace(marker, insert + marker, 1)
          header.write_text(p, encoding='utf-8')

          form = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs')
          p = form.read_text(encoding='utf-8-sig')

          old = '''        public DateTime SelectedDate => dateNX.DateTime;\n        //public int SelectedTabAddNM => tabPaneHVN.SelectedPage == tabHN ? 2 : 1;\n        public int SelectedTabAddNM =>\n        _cfg.Delivery.CoNhieuNhaMay\n        ? (tabPaneHVN.SelectedPage == tabHN ? 2 : 1)\n        : _cfg.Delivery.AddNmMacDinh;  // ← cố định cho 10003\n'''
          new = '''        public DateTime SelectedDate =>\n            _phieuHeaderControl != null ? _phieuHeaderControl.SelectedDate : DateTime.MinValue;\n\n        public int SelectedTabAddNM =>\n            _phieuHeaderControl != null ? _phieuHeaderControl.SelectedTabAddNM : _cfg.Delivery.AddNmMacDinh;\n'''
          if old not in p:
              raise SystemExit('SelectedDate/SelectedTabAddNM block not found')
          p = p.replace(old, new, 1)

          old = '''        public void SetTab(int addNM)\n        {\n            if (addNM == 2)\n            {\n                tabPaneHVN.SelectedPage = tabHN;\n                tabVP.PageVisible = false;          // ẩn tab còn lại\n            }\n            else\n            {\n                tabPaneHVN.SelectedPage = tabVP;\n                tabHN.PageVisible = false;\n            }\n        }\n        public void LockDatePicker() => dateNX.Enabled = false;\n        public void UnlockDatePicker() => dateNX.Enabled = true;\n'''
          new = '''        public void SetTab(int addNM)\n        {\n            if (_phieuHeaderControl != null)\n                _phieuHeaderControl.SetTab(addNM);\n        }\n\n        public void LockDatePicker()\n        {\n            if (_phieuHeaderControl != null)\n                _phieuHeaderControl.LockDatePicker();\n        }\n\n        public void UnlockDatePicker()\n        {\n            if (_phieuHeaderControl != null)\n                _phieuHeaderControl.UnlockDatePicker();\n        }\n'''
          if old not in p:
              raise SystemExit('SetTab/LockDatePicker block not found')
          p = p.replace(old, new, 1)
          form.write_text(p, encoding='utf-8')
          PY

      - name: Verify Phase 10N
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs').read_text(encoding='utf-8-sig')
          f = Path('PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs').read_text(encoding='utf-8-sig')
          required = ['public DateTime SelectedDate', 'public int SelectedTabAddNM', 'public void SetTab(int addNM)', 'public void LockDatePicker()', 'public void UnlockDatePicker()']
          for x in required:
              assert x in h, x + ' missing in header control'
          assert 'tabPaneHVN.SelectedPage == tabHN' not in f
          assert 'public DateTime SelectedDate => dateNX.DateTime;' not in f
          assert 'public void LockDatePicker() => dateNX.Enabled = false;' not in f
          assert 'public void UnlockDatePicker() => dateNX.Enabled = true;' not in f
          print('Phase 10N verification passed')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/Modules/GiaoHangKhach/HVN/Controls/PhieuHeaderControl.cs PCTP/Modules/GiaoHangKhach/HVN/HVN_PGH.cs
          git commit -m 'Phase 10N: move header state ownership into PhieuHeaderControl'
          git push
