name: Phase 10B align PhieuPresenter cross boundaries

on:
  push:
    paths:
      - '.github/workflows/phase10b-phieu-cross-boundaries.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align cross-boundary UI calls
        shell: python
        run: |
          from pathlib import Path
          path = Path('PCTP/Presentation/Presenters/PhieuPresenter.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '_v.GetCheckedGioXuat()': '_c.YmvnView.GetCheckedGioXuat()',
              '_v.ShowReportYMVN(': '_c.YmvnView.ShowReportYMVN(',
              '_v.HoiXoaDocQR()': '_c.DocQrView.HoiXoaDocQR()',
              '_v.SetCheckedGiosYMVN(': '_c.YmvnView.SetCheckedGiosYMVN(',
              '_v.LockCheckListYMVN()': '_c.YmvnView.LockCheckListYMVN()',
              '_v.UpdateGioXuatFromDB(': '_c.GiaoDbView.UpdateGioXuatFromDB(',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PCTP/Presentation/Presenters/PhieuPresenter.cs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Phase 10B: align PhieuPresenter cross boundaries'
          git push
